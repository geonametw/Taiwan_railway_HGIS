<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>古今鐵道營業線 — 路線數化結果總表（A4 精簡版）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');

    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
    }

    /* 連續報告書表格樣式 */
    .report-table {
      width: 100%;
      border-collapse: collapse;
      background: #ffffff;
      table-layout: fixed;
    }
    .report-table th,
    .report-table td {
      border: 1px solid #334155;
      padding: 4px 6px;
      vertical-align: middle;
    }
    .report-table thead th {
      background-color: #e2e8f0;
      font-weight: 700;
      font-size: 12px;
      text-align: left;
      color: #0f172a;
      padding: 5px 6px;
    }
    .report-table tbody tr {
      break-inside: avoid;
      page-break-inside: avoid;
    }

    /* 雙欄並排密排模式 */
    .two-col-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }
    .two-col-card {
      border: 1px solid #334155;
      background: #ffffff;
      break-inside: avoid;
      page-break-inside: avoid;
      overflow: hidden;
    }

    /* 迷你地圖容器與淡化底圖 */
    .mini-map-box {
      width: 100%;
      position: relative;
      background: #e2e8f0;
      overflow: hidden;
    }
    .leaflet-container {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background: #e2e8f0;
    }
    .muted-tiles .leaflet-tile-pane {
      filter: saturate(0.45) contrast(0.92) brightness(1.04);
    }

    /* 精簡比例尺與版權列 */
    .leaflet-control-scale-line {
      background: rgba(255, 255, 255, 0.9) !important;
      border-color: #0f172a !important;
      color: #0f172a !important;
      font-size: 9px !important;
      font-weight: 700 !important;
      line-height: 1.1 !important;
      padding: 1px 4px !important;
      margin-bottom: 2px !important;
      margin-left: 2px !important;
    }
    .leaflet-control-attribution {
      font-size: 8px !important;
      padding: 0 3px !important;
      background: rgba(255, 255, 255, 0.72) !important;
      line-height: 1.2 !important;
    }

    /* 類型小標籤 */
    .type-pill {
      display: inline-block;
      font-size: 10px;
      line-height: 1.2;
      padding: 1px 4px;
      border-radius: 3px;
      border: 1px solid;
      font-weight: 600;
      margin-right: 2px;
      margin-top: 2px;
    }

    /* A4 列印最佳化：每頁可達 7~8 條（單欄）或 10~12 條（雙欄） */
    @page {
      size: A4 portrait;
      margin: 9mm 10mm;
    }
    @media print {
      body {
        background: #ffffff !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .no-print {
        display: none !important;
      }
      .print-shell {
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
        box-shadow: none !important;
        border: none !important;
      }
      .report-table thead {
        display: table-header-group;
      }
      .report-table th,
      .report-table td {
        padding: 3px 5px !important;
      }
      /* 列印時隱藏地圖縮放鈕，避免遮擋軌跡 */
      .leaflet-control-zoom {
        display: none !important;
      }
    }
  </style>
</head>
<body class="min-h-screen pb-10">

  <!-- 頂部控制列（列印時自動隱藏） -->
  <header class="no-print sticky top-0 z-50 bg-slate-900 text-white shadow-md">
    <div class="max-w-5xl mx-auto px-3 py-2.5 flex flex-wrap items-center justify-between gap-2">
      <div>
        <h1 class="text-sm sm:text-base font-bold tracking-wide">古今鐵道營業線 — 數化結果總表（A4 高密度列印版）</h1>
        <p class="text-[11px] text-slate-300">單欄連續表每頁 A4 約 7–8 條；雙欄模式每頁約 10–12 條</p>
      </div>
      <div class="flex flex-wrap items-center gap-1.5">
        <label class="cursor-pointer bg-slate-700 hover:bg-slate-600 text-xs px-2.5 py-1.5 rounded-lg transition">
          選擇本機 JSON
          <input id="fileInput" type="file" accept=".json,.geojson" class="hidden" />
        </label>
        <button id="renderAllBtn" class="bg-amber-600 hover:bg-amber-500 text-xs font-semibold px-2.5 py-1.5 rounded-lg transition">
          渲染目前所有地圖
        </button>
        <button id="printBtn" class="bg-emerald-600 hover:bg-emerald-500 text-xs font-semibold px-3 py-1.5 rounded-lg transition">
          列印 / 另存 PDF
        </button>
      </div>
    </div>

    <!-- 篩選與排版控制列 -->
    <div class="bg-slate-800 border-t border-slate-700">
      <div class="max-w-5xl mx-auto px-3 py-2 flex flex-wrap items-center gap-2 text-xs">
        <div class="flex items-center gap-1">
          <span class="text-slate-400">路徑：</span>
          <input id="jsonPathInput" type="text" value="./data.json"
            class="bg-slate-900 border border-slate-600 rounded-md px-2 py-1 w-36 text-slate-100 focus:outline-none focus:border-sky-400" />
          <button id="reloadBtn" class="bg-sky-600 hover:bg-sky-500 px-2 py-1 rounded-md font-medium">重讀</button>
        </div>

        <select id="regionFilter" class="bg-slate-900 border border-slate-600 rounded-md px-2 py-1 text-slate-100">
          <option value="ALL">全臺所有分區</option>
          <option value="A">A 區（臺北）</option>
          <option value="B">B 區（桃竹）</option>
          <option value="C">C 區（苗中）</option>
          <option value="D">D 區（中彰投雲）</option>
          <option value="E">E 區（嘉南）</option>
          <option value="F">F 區（高屏）</option>
          <option value="G">G 區（宜蘭）</option>
          <option value="H">H 區（花東）</option>
          <option value="I">I 區（軍用速成）</option>
          <option value="OTHER">其他</option>
        </select>

        <input id="searchInput" type="text" placeholder="搜尋編號或線名..."
          class="bg-slate-900 border border-slate-600 rounded-md px-2 py-1 w-32 text-slate-100 placeholder-slate-400 focus:outline-none focus:border-sky-400" />

        <select id="layoutSelect" class="bg-slate-900 border border-slate-600 rounded-md px-2 py-1 text-slate-100">
          <option value="table" selected>單欄連續表（約 7–8 條/頁）</option>
          <option value="two-col">雙欄並排（約 10–12 條/頁）</option>
        </select>

        <select id="heightSelect" class="bg-slate-900 border border-slate-600 rounded-md px-2 py-1 text-slate-100">
          <option value="95">極緊湊（95px｜約 9 條/頁）</option>
          <option value="112" selected>標準精簡（112px｜約 7–8 條/頁）</option>
          <option value="138">較大圖面（138px｜約 6 條/頁）</option>
        </select>

        <select id="basemapSelect" class="bg-slate-900 border border-slate-600 rounded-md px-2 py-1 text-slate-100">
          <option value="google_muted" selected>Google 淡化街道</option>
          <option value="google_road">Google 街道</option>
          <option value="google_hybrid">Google 衛星混合</option>
          <option value="osm">OpenStreetMap</option>
        </select>
      </div>
    </div>
  </header>

  <!-- 狀態提示列 -->
  <div class="no-print max-w-5xl mx-auto px-3 pt-3">
    <div id="statusBar" class="bg-white border border-slate-200 rounded-lg px-3 py-2 text-xs text-slate-600 flex flex-wrap items-center justify-between gap-2 shadow-sm">
      <span id="statusText">正在初始化並嘗試讀取 ./data.json...</span>
      <span id="renderProgress" class="font-medium text-sky-700"></span>
    </div>
  </div>

  <!-- 主輸出區（A4 寬度模擬） -->
  <main class="print-shell max-w-5xl mx-auto px-3 pt-3">
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-3 sm:p-4 print-shell">
      <!-- 報告書頁首標題 -->
      <div class="flex flex-wrap items-baseline justify-between gap-2 pb-1.5 mb-2 border-b border-slate-300">
        <h2 class="text-sm font-bold text-slate-900">古今鐵道營業線 — 路線數化結果一覽</h2>
        <div id="summaryMeta" class="text-[11px] text-slate-600">載入中...</div>
      </div>

      <!-- 動態表格／雙欄容器 -->
      <div id="outputContainer"></div>

      <!-- 空狀態提示 -->
      <div id="emptyState" class="hidden py-10 text-center text-slate-500 text-sm">
        找不到符合條件的路線資料，請確認 <code>data.json</code> 路徑或點擊上方「選擇本機 JSON」手動載入。
      </div>
    </div>
  </main>

  <!-- 浮動 Toast 提示（取代 alert） -->
  <div id="toast" class="no-print fixed bottom-5 right-5 z-50 bg-slate-900 text-white text-xs px-4 py-2.5 rounded-lg shadow-lg opacity-0 pointer-events-none transition-opacity duration-200"></div>

  <script>
    // =========================================================================
    // 1. 全域狀態與 DOM 參照
    // =========================================================================
    const state = {
      allRoutes: [],
      filteredRoutes: [],
      sourceLabel: "./data.json",
      layoutMode: "table",   // "table" | "two-col"
      mapHeight: 112,        // px
      basemap: "google_muted",
      mapInstances: new Map(), // key -> { map, tileLayer }
      observer: null
    };

    const els = {
      fileInput: document.getElementById("fileInput"),
      renderAllBtn: document.getElementById("renderAllBtn"),
      printBtn: document.getElementById("printBtn"),
      jsonPathInput: document.getElementById("jsonPathInput"),
      reloadBtn: document.getElementById("reloadBtn"),
      regionFilter: document.getElementById("regionFilter"),
      searchInput: document.getElementById("searchInput"),
      layoutSelect: document.getElementById("layoutSelect"),
      heightSelect: document.getElementById("heightSelect"),
      basemapSelect: document.getElementById("basemapSelect"),
      statusText: document.getElementById("statusText"),
      renderProgress: document.getElementById("renderProgress"),
      summaryMeta: document.getElementById("summaryMeta"),
      outputContainer: document.getElementById("outputContainer"),
      emptyState: document.getElementById("emptyState"),
      toast: document.getElementById("toast")
    };

    const TILE_PROVIDERS = {
      google_muted: {
        url: "https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}",
        attribution: "Google",
        muted: true
      },
      google_road: {
        url: "https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}",
        attribution: "Google",
        muted: false
      },
      google_hybrid: {
        url: "https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}",
        attribution: "Google",
        muted: false
      },
      osm: {
        url: "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        attribution: "OSM",
        muted: false
      }
    };

    let toastTimer = null;
    function showToast(msg, duration = 2600) {
      els.toast.textContent = msg;
      els.toast.classList.remove("opacity-0", "pointer-events-none");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        els.toast.classList.add("opacity-0", "pointer-events-none");
      }, duration);
    }

    // =========================================================================
    // 2. 幾何運算與輔助函式（Haversine 距離與自然排序）
    // =========================================================================
    function haversineKm(lat1, lon1, lat2, lon2) {
      const R = 6371.0088;
      const toRad = d => (d * Math.PI) / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    /**
     * 計算單一 LineString（[lng, lat][]）之長度（公里）
     */
    function calcLineLengthKm(coords) {
      let km = 0;
      for (let i = 1; i < coords.length; i++) {
        const [lon1, lat1] = coords[i - 1];
        const [lon2, lat2] = coords[i];
        if (Number.isFinite(lat1) && Number.isFinite(lon1) && Number.isFinite(lat2) && Number.isFinite(lon2)) {
          km += haversineKm(lat1, lon1, lat2, lon2);
        }
      }
      return km;
    }

    /**
     * 依 A1, A1-2, A2, ..., A10, B1 等自然規則排序路線編號
     */
    function compareRouteId(a, b) {
      const parse = (id) => {
        const m = String(id).match(/^([A-I])(\d+)(?:-(.+))?$/i);
        if (!m) return { zone: "Z", num: 999999, sub: String(id) };
        return { zone: m[1].toUpperCase(), num: parseInt(m[2], 10), sub: m[3] || "" };
      };
      const pa = parse(a);
      const pb = parse(b);
      if (pa.zone !== pb.zone) return pa.zone.localeCompare(pb.zone);
      if (pa.num !== pb.num) return pa.num - pb.num;
      if (pa.sub === pb.sub) return 0;
      if (!pa.sub) return -1;
      if (!pb.sub) return 1;
      const na = parseInt(pa.sub, 10);
      const nb = parseInt(pb.sub, 10);
      if (!isNaN(na) && !isNaN(nb) && na !== nb) return na - nb;
      return pa.sub.localeCompare(pb.sub, "zh-Hant");
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function getRegionCode(routeId) {
      const m = String(routeId || "").match(/^([A-I])\d/i);
      return m ? m[1].toUpperCase() : "OTHER";
    }

    // =========================================================================
    // 3. 解析 data.json（支援 { data: { features, names } } 與標準 FeatureCollection）
    // =========================================================================
    function extractFeaturesAndNames(raw) {
      let features = [];
      let namesMap = {};

      if (raw && raw.data && Array.isArray(raw.data.features)) {
        features = raw.data.features;
        namesMap = raw.data.names || {};
      } else if (raw && Array.isArray(raw.features)) {
        features = raw.features;
        namesMap = raw.names || {};
      } else if (Array.isArray(raw)) {
        features = raw;
      }

      return { features, namesMap };
    }

    function parseRoutesFromJson(raw) {
      const { features, namesMap } = extractFeaturesAndNames(raw);
      const routeMap = new Map();

      for (const feat of features) {
        if (!feat || !feat.geometry) continue;
        const gType = feat.geometry.type;
        if (gType !== "LineString" && gType !== "MultiLineString") continue;

        const props = feat.properties || {};
        const lineType = String(props.line_type || "主線");
        if (lineType === "車站") continue;

        const routeId = String(props.route_id || props.id || props.code || "").trim();
        if (!routeId) continue;

        // 取出所有折線陣列（[lng, lat][]）
        const rawLines = gType === "LineString"
          ? [feat.geometry.coordinates]
          : feat.geometry.coordinates;

        const validLines = (rawLines || []).filter(line => Array.isArray(line) && line.length >= 2);
        if (validLines.length === 0) continue;

        if (!routeMap.has(routeId)) {
          routeMap.set(routeId, {
            id: routeId,
            region: getRegionCode(routeId),
            name: namesMap[routeId] || props.name || routeId,
            period: (props.period && props.period !== "未知") ? String(props.period) : "",
            types: new Set(),
            segments: [], // { lineType, coords }
            mainKm: 0,
            oldKm: 0,
            totalKm: 0,
            pointCount: 0
          });
        }

        const entry = routeMap.get(routeId);
        // 優先採用主線名稱與有效年代
        if (!entry.name && props.name) entry.name = props.name;
        if (!entry.period && props.period && props.period !== "未知") {
          entry.period = String(props.period);
        }

        const normalizedType = lineType.includes("舊")
          ? "舊線"
          : (lineType.includes("副") || lineType.includes("支"))
            ? "副/支線"
            : "主線";
        entry.types.add(normalizedType);

        for (const coords of validLines) {
          const km = calcLineLengthKm(coords);
          entry.segments.push({ lineType: normalizedType, coords });
          entry.totalKm += km;
          if (normalizedType === "舊線") entry.oldKm += km;
          else entry.mainKm += km;
          entry.pointCount += coords.length;
        }
      }

      const routes = Array.from(routeMap.values()).map(r => ({
        ...r,
        types: Array.from(r.types).sort((a, b) => {
          const order = { "主線": 1, "副/支線": 2, "舊線": 3 };
          return (order[a] || 9) - (order[b] || 9);
        })
      }));

      routes.sort((a, b) => compareRouteId(a.id, b.id));
      return routes;
    }

    // =========================================================================
    // 4. 清理與建立 Leaflet 迷你地圖
    // =========================================================================
    function clearAllMaps() {
      if (state.observer) {
        state.observer.disconnect();
        state.observer = null;
      }
      for (const { map } of state.mapInstances.values()) {
        try { map.remove(); } catch (_) {}
      }
      state.mapInstances.clear();
    }

    function updateRenderProgress() {
      const total = state.filteredRoutes.length;
      const done = state.mapInstances.size;
      els.renderProgress.textContent = total > 0
        ? `已載入地圖：${done} / ${total}`
        : "";
    }

    function initRouteMap(route, containerEl) {
      if (!containerEl || state.mapInstances.has(route.id)) return;

      const provider = TILE_PROVIDERS[state.basemap] || TILE_PROVIDERS.google_muted;
      containerEl.innerHTML = "";
      containerEl.classList.toggle("muted-tiles", Boolean(provider.muted));

      const map = L.map(containerEl, {
        zoomControl: false, // 精簡版預設隱藏 +/- 鈕，不遮擋小地圖
        attributionControl: true,
        scrollWheelZoom: false,
        dragging: true,
        doubleClickZoom: false,
        boxZoom: false,
        preferCanvas: true
      });
      map.attributionControl.setPrefix(false);

      const tileLayer = L.tileLayer(provider.url, {
        maxZoom: 19,
        attribution: provider.attribution,
        crossOrigin: true
      }).addTo(map);

      // 公制比例尺
      L.control.scale({
        position: "bottomleft",
        imperial: false,
        metric: true,
        maxWidth: 75
      }).addTo(map);

      const bounds = L.latLngBounds([]);

      // 先繪舊線，再繪副/支線，最後繪主線確保主線在最上層
      const drawOrder = { "舊線": 1, "副/支線": 2, "主線": 3 };
      const sortedSegs = [...route.segments].sort(
        (a, b) => (drawOrder[a.lineType] || 0) - (drawOrder[b.lineType] || 0)
      );

      for (const seg of sortedSegs) {
        const latlngs = seg.coords.map(([lng, lat]) => [lat, lng]);
        latlngs.forEach(pt => bounds.extend(pt));

        let style;
        if (seg.lineType === "舊線") {
          style = { color: "#334155", weight: 2.2, opacity: 0.85, dashArray: "5, 4" };
        } else if (seg.lineType === "副/支線") {
          style = { color: "#2563eb", weight: 2.8, opacity: 0.92 };
        } else {
          style = { color: "#ea580c", weight: 3.2, opacity: 0.95 };
        }

        L.polyline(latlngs, style).addTo(map);

        // 起訖小端點（主線與副/支線標示起迄點）
        if (seg.lineType !== "舊線" && latlngs.length >= 2) {
          L.circleMarker(latlngs[0], {
            radius: 3, color: "#ffffff", weight: 1, fillColor: "#16a34a", fillOpacity: 1
          }).addTo(map);
          L.circleMarker(latlngs[latlngs.length - 1], {
            radius: 3, color: "#ffffff", weight: 1, fillColor: "#dc2626", fillOpacity: 1
          }).addTo(map);
        }
      }

      if (bounds.isValid()) {
        map.fitBounds(bounds, { padding: [12, 14], maxZoom: 16 });
      } else {
        map.setView([23.7, 120.9], 7);
      }

      state.mapInstances.set(route.id, { map, tileLayer, containerEl });
      updateRenderProgress();
    }

    // =========================================================================
    // 5. 繪製精簡表格（單欄連續表 / 雙欄並排）
    // =========================================================================
    function renderTypePills(types) {
      return types.map(t => {
        if (t === "主線") {
          return `<span class="type-pill bg-orange-50 text-orange-700 border-orange-300">主</span>`;
        }
        if (t === "副/支線") {
          return `<span class="type-pill bg-blue-50 text-blue-700 border-blue-300">副</span>`;
        }
        return `<span class="type-pill bg-slate-100 text-slate-700 border-slate-300">舊</span>`;
      }).join("");
    }

    function formatLengthText(r) {
      const totalStr = `${r.totalKm.toFixed(2)} km`;
      if (r.mainKm > 0 && r.oldKm > 0) {
        return `<span class="font-bold text-slate-900">${totalStr}</span> <span class="text-[10px] text-slate-500">(主副${r.mainKm.toFixed(1)}+舊${r.oldKm.toFixed(1)})</span>`;
      }
      return `<span class="font-bold text-slate-900">${totalStr}</span>`;
    }

    function renderOutput() {
      clearAllMaps();

      const region = els.regionFilter.value;
      const kw = els.searchInput.value.trim().toLowerCase();

      state.filteredRoutes = state.allRoutes.filter(r => {
        if (region !== "ALL" && r.region !== region) return false;
        if (kw) {
          const hay = `${r.id} ${r.name} ${r.period}`.toLowerCase();
          if (!hay.includes(kw)) return false;
        }
        return true;
      });

      const totalKm = state.filteredRoutes.reduce((s, r) => s + r.totalKm, 0);
      els.summaryMeta.textContent =
        `來源：${state.sourceLabel}｜分區：${region}｜共 ${state.filteredRoutes.length} 條｜總長：${totalKm.toFixed(2)} km`;

      if (state.filteredRoutes.length === 0) {
        els.outputContainer.innerHTML = "";
        els.emptyState.classList.remove("hidden");
        updateRenderProgress();
        return;
      }

      els.emptyState.classList.add("hidden");
      const h = state.mapHeight;

      if (state.layoutMode === "table") {
        // 單欄連續表格：整份共用一個表頭（列印時每頁自動重複一次）
        const rowsHtml = state.filteredRoutes.map(r => `
          <tr>
            <td class="align-middle">
              <div class="font-bold text-xs text-slate-900 leading-tight">${escapeHtml(r.id)}</div>
              <div class="mt-0.5">${renderTypePills(r.types)}</div>
            </td>
            <td class="align-middle">
              <div class="font-bold text-xs text-slate-900 leading-snug">${escapeHtml(r.name)}</div>
              <div class="text-[11px] text-slate-700 mt-0.5">長：${formatLengthText(r)}</div>
              ${r.period ? `<div class="text-[10px] text-slate-500 mt-0.5">${escapeHtml(r.period)}</div>` : ""}
            </td>
            <td class="p-1">
              <div
                class="mini-map-box border border-slate-300"
                style="height:${h}px;"
                data-route-id="${escapeHtml(r.id)}"
              >
                <div class="w-full h-full flex items-center justify-center text-[11px] text-slate-500">
                  捲動至此載入地圖...
                </div>
              </div>
            </td>
          </tr>
        `).join("");

        els.outputContainer.innerHTML = `
          <table class="report-table">
            <colgroup>
              <col style="width: 58px;" />
              <col style="width: 145px;" />
              <col />
            </colgroup>
            <thead>
              <tr>
                <th>編號</th>
                <th>線名／長度</th>
                <th>數化結果（Google Maps 底圖・比例尺）</th>
              </tr>
            </thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        `;
      } else {
        // 雙欄並排模式：一頁 A4 可排 10~12 條
        const cardsHtml = state.filteredRoutes.map(r => `
          <div class="two-col-card">
            <div class="flex items-center justify-between gap-1 bg-slate-100 border-b border-slate-300 px-2 py-1">
              <div class="truncate">
                <span class="font-bold text-xs text-slate-900 mr-1">${escapeHtml(r.id)}</span>
                <span class="font-semibold text-xs text-slate-800">${escapeHtml(r.name)}</span>
              </div>
              <div class="shrink-0 text-[10px] text-slate-700 font-bold">
                ${r.totalKm.toFixed(2)} km
              </div>
            </div>
            <div
              class="mini-map-box"
              style="height:${h}px;"
              data-route-id="${escapeHtml(r.id)}"
            >
              <div class="w-full h-full flex items-center justify-center text-[10px] text-slate-500">
                捲動載入...
              </div>
            </div>
          </div>
        `).join("");

        els.outputContainer.innerHTML = `<div class="two-col-grid">${cardsHtml}</div>`;
      }

      // 綁定 IntersectionObserver 懶載入可視範圍內的地圖
      const routeLookup = new Map(state.filteredRoutes.map(r => [r.id, r]));
      const mapBoxes = els.outputContainer.querySelectorAll(".mini-map-box");

      state.observer = new IntersectionObserver((entries) => {
        for (const entry of entries) {
          if (entry.isIntersecting) {
            const box = entry.target;
            const id = box.getAttribute("data-route-id");
            const route = routeLookup.get(id);
            if (route) initRouteMap(route, box);
            state.observer.unobserve(box);
          }
        }
      }, { rootMargin: "250px 0px" });

      mapBoxes.forEach(box => state.observer.observe(box));
      updateRenderProgress();
    }

    /**
     * 批次渲染目前篩選清單中的所有地圖（供列印／另存 PDF 前執行）
     */
    async function renderAllFilteredMaps() {
      const routeLookup = new Map(state.filteredRoutes.map(r => [r.id, r]));
      const boxes = Array.from(els.outputContainer.querySelectorAll(".mini-map-box"))
        .filter(b => !state.mapInstances.has(b.getAttribute("data-route-id")));

      if (boxes.length === 0) {
        showToast("目前所有路線地圖均已渲染完成！");
        return;
      }

      els.renderAllBtn.disabled = true;
      els.renderAllBtn.textContent = "渲染中...";

      const batchSize = 8;
      for (let i = 0; i < boxes.length; i += batchSize) {
        const slice = boxes.slice(i, i + batchSize);
        for (const box of slice) {
          const route = routeLookup.get(box.getAttribute("data-route-id"));
          if (route) initRouteMap(route, box);
        }
        await new Promise(r => setTimeout(r, 35));
      }

      els.renderAllBtn.disabled = false;
      els.renderAllBtn.textContent = "渲染目前所有地圖";
      showToast(`已完成全部 ${state.filteredRoutes.length} 張地圖渲染，建議等待圖磚載入 2 秒後列印！`, 3500);
    }

    function updateBasemapForAll() {
      const provider = TILE_PROVIDERS[state.basemap] || TILE_PROVIDERS.google_muted;
      for (const entry of state.mapInstances.values()) {
        entry.containerEl.classList.toggle("muted-tiles", Boolean(provider.muted));
        entry.map.removeLayer(entry.tileLayer);
        entry.tileLayer = L.tileLayer(provider.url, {
          maxZoom: 19,
          attribution: provider.attribution,
          crossOrigin: true
        }).addTo(entry.map);
      }
    }

    // =========================================================================
    // 6. 載入 JSON（自動區分 GitHub Pages 與 blob 預覽環境）
    // =========================================================================
    function isNonHttpOrigin() {
      const p = window.location.protocol;
      return p !== "http:" && p !== "https:";
    }

    function resolveFetchUrl(rawPath) {
      const cleanPath = (rawPath || "./data.json").trim();
      const REMOTE_FALLBACK = "https://geonametw.github.io/Taiwan_railway_HGIS/data.json";
      if (/^https?:\/\//i.test(cleanPath)) return { url: cleanPath, usedFallback: false };
      if (isNonHttpOrigin()) return { url: REMOTE_FALLBACK, usedFallback: true };
      try {
        return { url: new URL(cleanPath, window.location.href).href, usedFallback: false };
      } catch {
        return { url: REMOTE_FALLBACK, usedFallback: true };
      }
    }

    function loadJsonObject(json, label) {
      state.sourceLabel = label;
      state.allRoutes = parseRoutesFromJson(json);
      els.statusText.textContent = `已載入 ${state.allRoutes.length} 條路線（來源：${label}）。列印前請先按「渲染目前所有地圖」。`;
      renderOutput();
    }

    async function fetchJsonFromPath(path) {
      const cleanPath = (path || "./data.json").trim();
      const { url: targetUrl, usedFallback } = resolveFetchUrl(cleanPath);

      els.statusText.textContent = usedFallback
        ? `偵測到預覽環境，自動改讀線上圖資：${targetUrl}...`
        : `正在讀取 ${cleanPath}...`;

      try {
        const res = await fetch(targetUrl, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        loadJsonObject(json, usedFallback ? "線上 data.json" : cleanPath);
        showToast(`成功讀取 ${state.allRoutes.length} 條路線`);
      } catch (err) {
        console.error(err);
        els.statusText.textContent = `無法自動讀取 ${targetUrl}（${err.message}），請點擊「選擇本機 JSON」手動載入。`;
        els.emptyState.classList.remove("hidden");
        showToast("自動讀取失敗，請改用本機 JSON 載入", 3500);
      }
    }

    // =========================================================================
    // 7. 事件監聽
    // =========================================================================
    els.reloadBtn.addEventListener("click", () => fetchJsonFromPath(els.jsonPathInput.value));
    els.regionFilter.addEventListener("change", renderOutput);
    els.searchInput.addEventListener("input", renderOutput);
    els.layoutSelect.addEventListener("change", (e) => {
      state.layoutMode = e.target.value;
      renderOutput();
    });
    els.heightSelect.addEventListener("change", (e) => {
      state.mapHeight = parseInt(e.target.value, 10) || 112;
      renderOutput();
    });
    els.basemapSelect.addEventListener("change", (e) => {
      state.basemap = e.target.value;
      updateBasemapForAll();
    });
    els.renderAllBtn.addEventListener("click", renderAllFilteredMaps);
    els.printBtn.addEventListener("click", () => window.print());

    els.fileInput.addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const json = JSON.parse(reader.result);
          loadJsonObject(json, file.name);
          showToast(`已載入本機檔案：${file.name}`);
        } catch (err) {
          showToast(`JSON 解析失敗：${err.message}`, 4000);
        }
      };
      reader.readAsText(file, "utf-8");
    });

    window.addEventListener("DOMContentLoaded", () => {
      fetchJsonFromPath(els.jsonPathInput.value);
    });
  </script>
</body>
</html>

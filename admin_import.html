<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KML + CSV 智慧縫合神器 v2.1 - 古今鐵道 HGIS</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background: #f0f2f5; padding: 30px; color: #333; }
        .container { max-width: 850px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h2 { color: #1a237e; border-bottom: 3px solid #1a237e; padding-bottom: 10px; margin-top: 0; text-align: center; }
        
        .inventory-box { background: #e8eaf6; border: 1px solid #c5cae9; border-radius: 8px; padding: 15px; margin-bottom: 20px; display: none; }
        .inventory-header { font-size: 15px; font-weight: bold; color: #1a237e; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .tag-container { display: flex; flex-wrap: wrap; gap: 6px; max-height: 160px; overflow-y: auto; padding: 4px 2px; }
        .tag { background: white; border: 1px solid #7986cb; color: #283593; padding: 3px 9px; border-radius: 15px; font-size: 12px; font-weight: bold; display: inline-flex; align-items: center; }
        .tag.station { border-color: #4dd0e1; color: #006064; background: #e0f7fa; }
        .tag.sugar { border-color: #ef5350; color: #c62828; background: #ffebee; text-decoration: line-through; }
        .tag-sec { font-size: 11px; color: #777; font-weight: normal; margin-left: 4px; }

        .upload-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .upload-area { display: block; border: 2px dashed #3949ab; padding: 25px 15px; border-radius: 10px; background: #f8f9fa; text-align: center; cursor: pointer; transition: 0.2s; }
        .upload-area:hover { background: #e8eaf6; }
        .upload-area.loaded { border-color: #2e7d32; background: #e8f5e9; }
        input[type="file"] { display: none; }

        .options-bar { background: #fafafa; border: 1px solid #e0e0e0; padding: 12px 15px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; display: flex; gap: 18px; align-items: center; justify-content: center; flex-wrap: wrap; }
        
        .btn { background: #2e7d32; color: white; border: none; padding: 14px 30px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(46,125,50,0.2); display: inline-block; margin: 4px; }
        .btn:hover { background: #1b5e20; transform: translateY(-2px); }
        .btn:disabled { background: #ccc; cursor: not-allowed; box-shadow: none; transform: none; }
        .btn-clean { background: #00695c; padding: 8px 14px; font-size: 13px; border-radius: 6px; color: white; border: none; cursor: pointer; font-weight: bold; }
        .btn-clean:hover { background: #004d40; }
        
        .status { margin-top: 20px; font-size: 14px; padding: 15px; border-radius: 8px; display: none; line-height: 1.6; }
        .success { background: #e8f5e9; color: #1b5e20; border: 1px solid #c8e6c9; }
        .warning { background: #fff3e0; color: #e65100; border: 1px solid #ffe0b2; margin-bottom: 20px; display: block; }
        .error { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; margin-bottom: 20px; display: block; }
        .alert-mismatch { background: #fff8e1; border-left: 4px solid #ff8f00; padding: 10px 12px; margin-bottom: 12px; color: #bf360c; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🗺️ KML 圖資 + CSV 台車線名表 智慧縫合器 v2.1</h2>
    <div class="status warning">
        <b>💡 v2.1 升級重點：</b><br>
        1. <b>完整保留 v2.0 矩陣解析核心</b>：100% 對應 <code>台車編號表.csv</code>（4 列屬性 × 1895–1945 年份矩陣，共 317 組編號）。<br>
        2. <b>糖鐵線與雜訊線一鍵剔除</b>：自動過濾早期無編號糖鐵線（隆田線、學甲線等 18 條）與 Google Maps 預設 <code>Line xx km</code> / <code>線條 1</code> 雜訊，並將未命名支線自動歸戶至最近主線。<br>
        3. <b>支援多檔 KML 批次縫合</b>：可一次選擇多個分區的 KML 檔（如中、南、東部）同步匯入。
    </div>

    <div id="inventoryBox" class="inventory-box">
        <div class="inventory-header" id="inventoryTitle"></div>
        <div class="tag-container" id="inventoryList"></div>
    </div>

    <div class="options-bar">
        <b>路線主名稱 (name) 命名方式：</b>
        <label><input type="radio" name="nameMode" value="ref_line" checked> 參考名＋線（例：<code>三爪子線</code>）</label>
        <label><input type="radio" name="nameMode" value="code_ref"> 編號＋參考名（例：<code>A1 三爪子</code>）</label>
        <label><input type="radio" name="nameMode" value="last_official"> 最終年官方路線名（例：<code>三爪子線</code>）</label>
    </div>

    <div class="options-bar" style="background:#f3e5f5; border-color:#ce93d8;">
        <label style="font-weight:bold; color:#4a148c; cursor:pointer;">
            <input type="checkbox" id="chkRemoveSugar" checked>
            🧹 自動剔除早期無編號糖鐵線（SHP / Manual Import 共 18 條）與未命名雜訊線（Line xx km / 線條 1）
        </label>
    </div>
    
    <div class="upload-grid">
        <label class="upload-area" id="csvDrop" for="csvFile">
            <div style="font-size: 34px; margin-bottom: 8px;">📊</div>
            <div id="csvText" style="font-size: 16px; font-weight: bold; color: #3949ab;">步驟 1：選擇 CSV 屬性資料表<br><span style="font-size:12px; color:#666; font-weight:normal;">(台車編號表.csv)</span></div>
        </label>
        <input type="file" id="csvFile" accept=".csv" />

        <label class="upload-area" id="kmlDrop" for="kmlFile">
            <div style="font-size: 34px; margin-bottom: 8px;">📂</div>
            <div id="kmlText" style="font-size: 16px; font-weight: bold; color: #3949ab;">步驟 2：選擇 KML 路線圖資（可多選）<br><span style="font-size:12px; color:#666; font-weight:normal;">(台車地圖C/D/E/F...kml)</span></div>
        </label>
        <input type="file" id="kmlFile" accept=".kml,.xml" multiple />
    </div>

    <div style="text-align: center;">
        <button id="cleanOnlyBtn" class="btn" style="background:#00695c; display:none;" onclick="runCleanOnly()">🧹 僅剔除現有糖鐵線與雜訊（免選 KML/CSV）</button>
        <button id="mergeBtn" class="btn" disabled onclick="runMerge()">⚙️ 開始智慧縫合並執行空間防呆檢查</button>
        <button id="downloadBtn" class="btn" style="display:none; background:#1565c0;" onclick="downloadJSON()">📥 下載合併後的 data.json</button>
    </div>

    <div id="status" class="status"></div>
</div>

<script>
    let existingData = null;
    let oldPropsMap = {};
    let csvRoutesMap = {};
    let rawKmlTexts = [];
    let finalGeoJson = null;

    // 判斷是否為早期匯入之無編號糖鐵線或 Google Maps 未命名雜訊線
    function isLegacySugarOrNoiseRoute(f) {
        const p = f.properties || {};
        if (f.geometry && f.geometry.type === "Point") return false;
        if (!p.route_id || p.source === "SHP Import" || p.source === "Manual Import") return true;
        if (/^(Line\s+[\d.]+|線條\s*\d+|未命名)/i.test(String(p.route_id).trim())) return true;
        return false;
    }

    // 清理車站上可能殘留的 v9.6 _prebound 屬性
    function cleanStationFeature(f) {
        if (f && f.properties) {
            delete f.properties._preboundRouteIndices;
            delete f.properties._preboundRouteIds;
            delete f.properties._preboundGroupKeys;
            delete f.properties._boundRouteFeatures;
            delete f.properties._boundGroupKeys;
            delete f.properties._boundRouteIds;
        }
        return f;
    }

    // 自動抓取線上 data.json（支援同目錄與 GitHub 遠端備援）
    async function loadOnlineDataJson() {
        const urls = [
            'data.json?t=' + Date.now(),
            'https://raw.githubusercontent.com/geonametw/Taiwan_railway_HGIS/main/data.json?t=' + Date.now(),
            'https://geonametw.github.io/Taiwan_railway_HGIS/data.json?t=' + Date.now()
        ];
        for (const url of urls) {
            try {
                const res = await fetch(url, { cache: 'no-store' });
                if (!res.ok) continue;
                const data = await res.json();
                const features = (data.data && data.data.features) ? data.data.features : (data.features || []);
                if (Array.isArray(features)) return data;
            } catch (e) {}
        }
        throw new Error("無法連線讀取 data.json");
    }

    loadOnlineDataJson()
        .then(data => {
            existingData = data;
            const features = (data.data && data.data.features) ? data.data.features : (data.features || []);
            let routeCount = 0, sugarCount = 0, stationCount = 0;
            const listContainer = document.getElementById('inventoryList');
            listContainer.innerHTML = '';

            features.forEach((f, idx) => {
                const p = f.properties || {};
                const name = p.name || `未命名_${idx + 1}`;
                const rid = p.route_id ? `[${p.route_id}] ` : '';
                const section = p.section ? `<span class="tag-sec">(${p.section})</span>` : '';
                const isPoint = f.geometry && f.geometry.type === "Point";
                const isSugar = isLegacySugarOrNoiseRoute(f);

                if (isPoint) stationCount++;
                else if (isSugar) sugarCount++;
                else routeCount++;

                const key = p.route_id || p.name;
                if (key && !oldPropsMap[key]) oldPropsMap[key] = p;

                const tag = document.createElement('span');
                tag.className = isPoint ? 'tag station' : (isSugar ? 'tag sugar' : 'tag');
                tag.title = isSugar ? '早期無編號糖鐵線／雜訊線（將於匯出時自動剔除）' : '';
                tag.innerHTML = `${isPoint ? '🚉' : (isSugar ? '🗑️' : '🛤️')} ${rid}${name}${section}`;
                listContainer.appendChild(tag);
            });

            const invBox = document.getElementById('inventoryBox');
            invBox.style.display = 'block';
            document.getElementById('inventoryTitle').innerHTML = `
                <span>✅ 現有 <code>data.json</code> 讀取成功！</span>
                <span style="font-size: 13px; background: #1a237e; color: white; padding: 3px 10px; border-radius: 12px;">
                    台車路線 ${routeCount} 筆 / 待剔除糖鐵與雜訊 ${sugarCount} 筆 / 車站 ${stationCount} 座
                </span>
            `;
            if (sugarCount > 0) {
                document.getElementById('cleanOnlyBtn').style.display = 'inline-block';
            }
        })
        .catch(err => {
            const invBox = document.getElementById('inventoryBox');
            invBox.style.display = 'block';
            invBox.className = 'status error';
            invBox.innerHTML = `<b>⚠️ 無法自動讀取現有 <code>data.json</code></b>（將以全新狀態建立資料庫）。`;
        });

    function parseCSVLine(text) {
        const result = [];
        let cur = '', inQuotes = false;
        for (let i = 0; i < text.length; i++) {
            const ch = text[i];
            if (ch === '"') {
                inQuotes = !inQuotes;
            } else if (ch === ',' && !inQuotes) {
                result.push(cur.trim());
                cur = '';
            } else {
                cur += ch;
            }
        }
        result.push(cur.trim());
        return result;
    }

    document.getElementById('csvFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
            parseCSVData(evt.target.result);
            document.getElementById('csvDrop').classList.add('loaded');
            document.getElementById('csvText').innerHTML = `✅ CSV 已載入：<b>${file.name}</b><br><span style="font-size:12px; color:#1b5e20;">共解析出 ${Object.keys(csvRoutesMap).length} 組路線編號</span>`;
            checkReady();
        };
        reader.readAsText(file, 'UTF-8');
    });

    function parseCSVData(csvText) {
        csvRoutesMap = {};
        const lines = csvText.replace(/^\uFEFF/, '').split(/\r?\n/);
        let yearsHeader = [];
        for (let y = 1895; y <= 1945; y++) yearsHeader.push(String(y));

        const rawMatrix = {};
        lines.forEach(line => {
            if (!line.trim()) return;
            const cols = parseCSVLine(line);
            const code = cols[0];
            const refName = cols[1];
            const attrType = cols[2];

            if (!code || code === '編號' || !['經營者', '路線名', '區間', '里程'].includes(attrType)) return;

            if (!rawMatrix[code]) {
                rawMatrix[code] = { code: code, refName: refName || code, rows: { '經營者': {}, '路線名': {}, '區間': {}, '里程': {} } };
            }
            for (let i = 0; i < yearsHeader.length; i++) {
                const yr = yearsHeader[i];
                const val = cols[i + 3] ? cols[i + 3].trim() : '';
                if (val) rawMatrix[code].rows[attrType][yr] = val;
            }
        });

        Object.keys(rawMatrix).forEach(code => {
            const item = rawMatrix[code];
            const history = [];
            const allOperators = new Set();
            const allRouteNames = new Set();
            const allSections = new Set();

            for (let y = 1895; y <= 1945; y++) {
                const yr = String(y);
                const op = item.rows['經營者'][yr] || '';
                const rn = item.rows['路線名'][yr] || '';
                const sec = item.rows['區間'][yr] || '';
                const mi = item.rows['里程'][yr] || '';

                if (op) allOperators.add(op);
                if (rn) allRouteNames.add(rn);
                if (sec) allSections.add(sec);

                if (op || rn || sec || mi) {
                    const stateKey = `${op}|${rn}|${sec}|${mi}`;
                    if (history.length > 0 && history[history.length - 1].stateKey === stateKey && history[history.length - 1].endYear === y - 1) {
                        history[history.length - 1].endYear = y;
                    } else {
                        history.push({ startYear: y, endYear: y, op, rn, sec, mi, stateKey });
                    }
                }
            }

            const startYr = history.length > 0 ? history[0].startYear : null;
            const endYr = history.length > 0 ? history[history.length - 1].endYear : null;
            const secsArr = Array.from(allSections);
            const rnsArr = Array.from(allRouteNames);
            const lastSec = secsArr.length > 0 ? secsArr[secsArr.length - 1].replace(/-/g, '＝').replace(/—/g, '＝') : '';
            const lastRn = rnsArr.length > 0 ? rnsArr[rnsArr.length - 1] : '';

            csvRoutesMap[code] = {
                code: code,
                refName: item.refName,
                lastOfficialName: lastRn,
                section: lastSec,
                period: (startYr && endYr) ? `${startYr}–${endYr}` : '未知',
                operators: Array.from(allOperators),
                routeNames: rnsArr,
                history: history
            };
        });
    }

    document.getElementById('kmlFile').addEventListener('change', function(e) {
        const files = Array.from(e.target.files);
        if (!files.length) return;
        Promise.all(files.map(f => new Promise((res, rej) => {
            const r = new FileReader();
            r.onload = evt => res({ name: f.name, text: evt.target.result });
            r.onerror = rej;
            r.readAsText(f, 'UTF-8');
        }))).then(results => {
            rawKmlTexts = results;
            document.getElementById('kmlDrop').classList.add('loaded');
            document.getElementById('kmlText').innerHTML = `✅ KML 已載入（共 ${results.length} 檔）：<br><span style="font-size:12px; color:#1b5e20;">${results.map(r => r.name).join('、')}</span>`;
            checkReady();
        });
    });

    function checkReady() {
        if (rawKmlTexts.length > 0 && Object.keys(csvRoutesMap).length > 0) {
            document.getElementById('mergeBtn').disabled = false;
        }
    }

    function minDistCoordsListKm(list1, list2) {
        let minD = Infinity;
        list1.forEach(line1 => {
            const step1 = Math.max(1, Math.floor(line1.length / 40));
            for (let i = 0; i < line1.length; i += step1) {
                const p1 = line1[i];
                list2.forEach(line2 => {
                    const step2 = Math.max(1, Math.floor(line2.length / 40));
                    for (let j = 0; j < line2.length; j += step2) {
                        const p2 = line2[j];
                        const dx = (p1[0] - p2[0]) * 101.0;
                        const dy = (p1[1] - p2[1]) * 111.0;
                        const d = Math.hypot(dx, dy);
                        if (d < minD) minD = d;
                    }
                });
            }
        });
        return minD;
    }

    function buildHistoryHTML(mainCsv, subCsvList, folderName) {
        let html = `<div style="margin-bottom:6px;"><span style="background:#1a237e;color:white;padding:2px 7px;border-radius:4px;font-size:12px;">${mainCsv.code} ${folderName}</span>`;
        if (mainCsv.operators.length > 0) {
            html += ` <span style="font-size:12px;color:#555;">經營者：${mainCsv.operators.join('、')}</span>`;
        }
        html += `</div>`;

        const renderTable = (title, histArr) => {
            if (!histArr || histArr.length === 0) return '';
            let t = title ? `<div style="font-weight:bold;font-size:12px;color:#3949ab;margin-top:8px;">▸ ${title}</div>` : '';
            t += `<table style="width:100%;border-collapse:collapse;font-size:12px;margin-top:4px;">
                <thead><tr style="background:#e8eaf6;color:#1a237e;text-align:left;">
                    <th style="padding:4px;border:1px solid #ccc;">年份</th>
                    <th style="padding:4px;border:1px solid #ccc;">經營者</th>
                    <th style="padding:4px;border:1px solid #ccc;">路線名</th>
                    <th style="padding:4px;border:1px solid #ccc;">區間</th>
                    <th style="padding:4px;border:1px solid #ccc;">里程</th>
                </tr></thead><tbody>`;
            histArr.forEach(h => {
                const yrStr = h.startYear === h.endYear ? `${h.startYear}` : `${h.startYear}–${h.endYear}`;
                t += `<tr>
                    <td style="padding:3px 4px;border:1px solid #ddd;white-space:nowrap;">${yrStr}</td>
                    <td style="padding:3px 4px;border:1px solid #ddd;">${h.op || '—'}</td>
                    <td style="padding:3px 4px;border:1px solid #ddd;">${h.rn || '—'}</td>
                    <td style="padding:3px 4px;border:1px solid #ddd;">${h.sec || '—'}</td>
                    <td style="padding:3px 4px;border:1px solid #ddd;text-align:right;">${h.mi || '—'}</td>
                </tr>`;
            });
            t += `</tbody></table>`;
            return t;
        };

        if (mainCsv.history.length > 0) {
            html += renderTable('', mainCsv.history);
        } else {
            html += `<div style="color:#777;font-size:12px;">（年報無統計資料之專用線／待考路線）</div>`;
        }

        subCsvList.forEach(sub => {
            if (sub.history.length > 0) {
                html += renderTable(`附屬統計：${sub.code} ${sub.refName}`, sub.history);
            }
        });

        return html;
    }

    // 單獨清理現有 data.json 中的糖鐵線與雜訊線
    function runCleanOnly() {
        if (!existingData) return;
        const oldFeatures = (existingData.data && existingData.data.features)
            ? existingData.data.features
            : (existingData.features || []);

        const cleanedFeatures = [];
        let removedCount = 0;
        const seenStationKeys = new Set();

        oldFeatures.forEach(f => {
            const p = f.properties || {};
            const isPoint = f.geometry && f.geometry.type === "Point";
            if (isPoint) {
                const skey = `${p.name}_${f.geometry.coordinates.join(',')}`;
                if (!seenStationKeys.has(skey)) {
                    seenStationKeys.add(skey);
                    cleanedFeatures.push(cleanStationFeature(f));
                }
            } else if (isLegacySugarOrNoiseRoute(f)) {
                removedCount++;
            } else {
                cleanedFeatures.push(f);
            }
        });

        finalGeoJson = { data: { type: "FeatureCollection", features: cleanedFeatures } };
        const statusDiv = document.getElementById('status');
        statusDiv.style.display = 'block';
        statusDiv.className = 'status success';
        statusDiv.innerHTML = `
            <div style="font-size:16px; font-weight:bold;">
                🧹 清理完成！已移除 ${removedCount} 條早期無編號糖鐵線與未命名雜訊線，保留 ${cleanedFeatures.length} 筆純台車圖資。
            </div>
            <div style="margin-top:6px;">請點擊上方藍色「📥 下載合併後的 data.json」按鈕並覆蓋至 GitHub。</div>
        `;
        document.getElementById('downloadBtn').style.display = 'inline-block';
    }

    function runMerge() {
        const nameMode = document.querySelector('input[name="nameMode"]:checked').value;
        const removeSugar = document.getElementById('chkRemoveSugar').checked;
        const parser = new DOMParser();

        const kmlCodesSet = new Set();
        const groupedLines = {};
        const mainLinesCoordsMap = {}; // parentCode -> coordsList
        const unnamedBranches = [];
        const stationFeatures = [];

        rawKmlTexts.forEach(kmlObj => {
            const xmlDoc = parser.parseFromString(kmlObj.text, "text/xml");
            const placemarks = xmlDoc.getElementsByTagName("Placemark");

            for (let i = 0; i < placemarks.length; i++) {
                const p = placemarks[i];
                const nameNode = p.getElementsByTagName("name")[0];
                let rawCode = (nameNode && nameNode.textContent) ? nameNode.textContent.trim() : "";

                let parent = p.parentNode;
                let folderName = "未分類";
                while (parent && parent.nodeName !== "#document") {
                    if (parent.nodeName === "Folder") {
                        const fnNode = parent.getElementsByTagName("name")[0];
                        if (fnNode) folderName = fnNode.textContent.trim();
                        break;
                    }
                    parent = parent.parentNode;
                }

                const pointNode = p.getElementsByTagName("Point")[0];
                const lineNode = p.getElementsByTagName("LineString")[0];

                if (pointNode) {
                    const coords = pointNode.getElementsByTagName("coordinates")[0].textContent.trim().split(',');
                    if (coords.length >= 2) {
                        const stName = rawCode || "未命名車站";
                        stationFeatures.push({
                            type: "Feature",
                            properties: {
                                name: stName,
                                line_type: "車站",
                                status: "車站",
                                description: { zh: `【車站】${stName}` },
                                source: "KML Import",
                                last_updated: new Date().toISOString().split('T')[0]
                            },
                            geometry: { type: "Point", coordinates: [parseFloat(coords[0]), parseFloat(coords[1])] }
                        });
                    }
                } else if (lineNode) {
                    const coordArray = lineNode.getElementsByTagName("coordinates")[0].textContent.trim().split(/\s+/);
                    const lineCoords = [];
                    for (let c of coordArray) {
                        if (!c) continue;
                        const pts = c.split(',');
                        if (pts.length >= 2) lineCoords.push([parseFloat(pts[0]), parseFloat(pts[1])]);
                    }

                    if (lineCoords.length > 1) {
                        // 若未命名，或為 Google Maps 預設產生的 "Line xx km" / "線條 1"，一律歸入未命名支線自動尋找最近主線
                        if (!rawCode || /^(Line\s+[\d.]+|線條\s*\d+|未命名)/i.test(rawCode)) {
                            unnamedBranches.push({ folderName, lineCoords });
                        } else {
                            // 若 KML 名稱寫了「C1 竹南」，自動提取前方的編號「C1」以對齊 CSV
                            const codeMatch = rawCode.match(/^([A-Z]\d+(?:-[^\s]+)?)/i);
                            if (codeMatch) {
                                rawCode = codeMatch[1].charAt(0).toUpperCase() + codeMatch[1].slice(1);
                            }
                            kmlCodesSet.add(rawCode);
                            const groupKey = `${rawCode}__${folderName}`;
                            if (!groupedLines[groupKey]) {
                                groupedLines[groupKey] = { code: rawCode, folderName: folderName, coordsList: [] };
                            }
                            groupedLines[groupKey].coordsList.push(lineCoords);
                            if (folderName === "主線") {
                                mainLinesCoordsMap[rawCode.split('-')[0]] = groupedLines[groupKey].coordsList;
                            }
                        }
                    }
                }
            }
        });

        // 將未命名支線自動歸戶至距離最近的主線
        unnamedBranches.forEach(ub => {
            let bestParent = "未命名";
            let bestDist = Infinity;
            Object.keys(mainLinesCoordsMap).forEach(mCode => {
                const d = minDistCoordsListKm([ub.lineCoords], mainLinesCoordsMap[mCode]);
                if (d < bestDist) {
                    bestDist = d;
                    bestParent = mCode;
                }
            });
            if (bestParent === "未命名") return;
            const autoCode = `${bestParent}-支線`;
            kmlCodesSet.add(autoCode);
            const groupKey = `${autoCode}__${ub.folderName}`;
            if (!groupedLines[groupKey]) {
                groupedLines[groupKey] = { code: autoCode, folderName: ub.folderName, coordsList: [] };
            }
            groupedLines[groupKey].coordsList.push(ub.lineCoords);
        });

        const kmlParentSet = new Set();
        kmlCodesSet.forEach(c => kmlParentSet.add(c.split('-')[0]));

        const orphanSubMap = {};
        Object.keys(csvRoutesMap).forEach(csvCode => {
            if (!kmlCodesSet.has(csvCode) && csvCode.includes('-')) {
                const parentCode = csvCode.split('-')[0];
                if (kmlParentSet.has(parentCode)) {
                    if (!orphanSubMap[parentCode]) orphanSubMap[parentCode] = [];
                    orphanSubMap[parentCode].push(csvRoutesMap[csvCode]);
                }
            }
        });

        const mergedRouteFeatures = [];
        const matchedReport = [];
        const mismatchWarnings = [];

        Object.values(groupedLines).forEach(grp => {
            const code = grp.code;
            const parentCode = code.split('-')[0];
            const csvInfo = csvRoutesMap[code] || csvRoutesMap[parentCode] || {
                code: code, refName: code, lastOfficialName: '', section: '', period: '未知', operators: [], routeNames: [], history: []
            };

            if (grp.folderName !== '主線' && mainLinesCoordsMap[parentCode]) {
                const distToAssigned = minDistCoordsListKm(grp.coordsList, mainLinesCoordsMap[parentCode]);
                if (distToAssigned > 1.5) {
                    let closestCode = parentCode;
                    let closestDist = distToAssigned;
                    Object.keys(mainLinesCoordsMap).forEach(mCode => {
                        const d = minDistCoordsListKm(grp.coordsList, mainLinesCoordsMap[mCode]);
                        if (d < closestDist) {
                            closestDist = d;
                            closestCode = mCode;
                        }
                    });
                    if (closestCode !== parentCode) {
                        const closestName = csvRoutesMap[closestCode] ? csvRoutesMap[closestCode].refName : closestCode;
                        mismatchWarnings.push(`⚠️ <b>疑似錯標警告</b>：KML 中的 <b>${code} [${grp.folderName}]</b> 距離 ${parentCode} 主線達 <b>${distToAssigned.toFixed(1)} km</b>，但距離 <b>${closestCode} (${closestName}) 主線</b>僅 <b>${closestDist.toFixed(2)} km</b>！請檢查 KML 是否標錯編號。`);
                    }
                }
            }

            const baseCsv = csvRoutesMap[parentCode] || csvInfo;
            let displayName = baseCsv.refName;
            if (nameMode === 'ref_line') {
                displayName = baseCsv.refName.endsWith('線') ? baseCsv.refName : (baseCsv.refName + '線');
            } else if (nameMode === 'code_ref') {
                displayName = `${parentCode} ${baseCsv.refName}`;
            } else if (nameMode === 'last_official') {
                displayName = baseCsv.lastOfficialName || (baseCsv.refName + '線');
            }

            let displaySection = csvInfo.section || baseCsv.section || '';
            if (grp.folderName !== '主線') {
                displaySection = displaySection ? `${displaySection} (${grp.folderName})` : grp.folderName;
            }

            const orphanSubs = (grp.folderName === '主線' && orphanSubMap[code]) ? orphanSubMap[code] : [];
            const htmlTable = buildHistoryHTML(csvInfo, orphanSubs, grp.folderName);

            const geom = grp.coordsList.length === 1
                ? { type: "LineString", coordinates: grp.coordsList[0] }
                : { type: "MultiLineString", coordinates: grp.coordsList };

            const oldProp = oldPropsMap[code] || {};

            mergedRouteFeatures.push({
                type: "Feature",
                properties: {
                    route_id: code,
                    parent_id: parentCode,
                    line_type: grp.folderName,
                    name: displayName,
                    section: displaySection,
                    tailo: oldProp.tailo || "",
                    operators: csvInfo.operators.join('、'),
                    alt_names: csvInfo.routeNames.join('、'),
                    period: csvInfo.period,
                    status: "廢止",
                    description: { zh: htmlTable },
                    history: csvInfo.history,
                    source: "KML + CSV 107版",
                    last_updated: new Date().toISOString().split('T')[0]
                },
                geometry: geom
            });

            matchedReport.push(`${code} [${grp.folderName}] ➔ <b>${displayName}</b> <span style="color:#666;">(${displaySection || '無區間'})</span>`);
        });

        const preservedFeatures = [];
        const preservedNames = [];
        let removedSugarCount = 0;
        const oldFeatures = (existingData && existingData.data && existingData.data.features) 
            ? existingData.data.features 
            : ((existingData && existingData.features) ? existingData.features : []);

        const seenStationKeys = new Set();
        stationFeatures.forEach(sf => {
            seenStationKeys.add(`${sf.properties.name}_${sf.geometry.coordinates.join(',')}`);
        });

        oldFeatures.forEach(f => {
            const p = f.properties || {};
            const isPoint = f.geometry && f.geometry.type === "Point";
            if (isPoint) {
                const skey = `${p.name}_${f.geometry.coordinates.join(',')}`;
                if (!seenStationKeys.has(skey)) {
                    seenStationKeys.add(skey);
                    preservedFeatures.push(cleanStationFeature(f));
                }
            } else {
                if (p.source === "KML Import" && !p.route_id) return;
                if (removeSugar && isLegacySugarOrNoiseRoute(f)) {
                    removedSugarCount++;
                    return;
                }
                if (!kmlCodesSet.has(p.route_id) && !kmlParentSet.has(p.parent_id)) {
                    preservedFeatures.push(f);
                    preservedNames.push(p.route_id ? `${p.route_id} ${p.name}` : p.name);
                }
            }
        });

        const allFeatures = preservedFeatures.concat(mergedRouteFeatures, stationFeatures);
        finalGeoJson = { data: { type: "FeatureCollection", features: allFeatures } };

        const statusDiv = document.getElementById('status');
        statusDiv.style.display = 'block';
        statusDiv.className = 'status success';

        let warnHtml = mismatchWarnings.length > 0
            ? `<div class="alert-mismatch">${mismatchWarnings.join('<br>')}</div>`
            : `<div style="color:#2e7d32;font-weight:bold;margin-bottom:8px;">✅ 空間防呆檢查通過：所有舊線與副線皆位於其主線鄰近範圍內！</div>`;

        statusDiv.innerHTML = `
            <div style="font-size:16px; font-weight:bold; margin-bottom:10px;">
                🎉 縫合完成！目前資料庫總計 ${allFeatures.length} 筆圖資（本次新增/更新路線 ${mergedRouteFeatures.length} 筆、車站 ${stationFeatures.length} 座｜已自動剔除舊糖鐵與雜訊 ${removedSugarCount} 筆）
            </div>
            ${warnHtml}
            <b>📌 本次縫合之台車路線清冊：</b><br>
            <div style="max-height:200px; overflow-y:auto; background:white; padding:10px; border-radius:6px; border:1px solid #c8e6c9; margin-top:6px; font-size:13px;">
                ${matchedReport.join('<br>')}
            </div>
            <div style="margin-top:10px; font-size:13px; color:#2e7d32;">
                🛡️ <b>安全保留其他分區之台車路線（共 ${preservedNames.length} 筆）：</b> ${preservedNames.join('、') || '無'}
            </div>
        `;

        document.getElementById('downloadBtn').style.display = 'inline-block';
    }

    function downloadJSON() {
        if (!finalGeoJson) return;
        const dataStr = JSON.stringify(finalGeoJson, null, 2);
        const blob = new Blob([dataStr], {type: "application/json"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = "data.json";
        a.click();
    }
</script>
</body>
</html>

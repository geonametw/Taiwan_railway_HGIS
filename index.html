        function extractMetaFromTableHtml(tableHtml) {
            const rowRegex = /<tr>\s*<td[^>]*>([\s\S]*?)<\/td>\s*<td[^>]*>([\s\S]*?)<\/td>\s*<td[^>]*>([\s\S]*?)<\/td>\s*<td[^>]*>([\s\S]*?)<\/td>\s*<td[^>]*>([\s\S]*?)<\/td>\s*<\/tr>/g;
            const ops = [], secs = [];
            let m;
            while ((m = rowRegex.exec(tableHtml)) !== null) {
                const op = m[2].replace(/<[^>]+>/g, '').trim();
                const sec = m[4].replace(/<[^>]+>/g, '').trim();
                if (op && op !== '—') {
                    op.split('、').map(s => s.trim()).filter(Boolean).forEach(o => {
                        if (!ops.includes(o)) ops.push(o);
                    });
                }
                if (sec && sec !== '—' && !secs.includes(sec)) secs.push(sec);
            }
            const lastSec = secs.length > 0 ? secs[secs.length - 1].replace(/-/g, '＝').replace(/—/g, '＝') : '';
            return { operators: ops.join('、'), section: lastSec };
        }

        function buildFamilyRegistry(routeFeaturesList) {
            const byGroup = {};
            routeFeaturesList.forEach(f => {
                const p = f.properties || {};
                const gk = p.parent_id || p.route_id || p.name;
                if (!byGroup[gk]) byGroup[gk] = [];
                byGroup[gk].push(f);
            });

            Object.keys(byGroup).forEach(gk => {
                const flist = byGroup[gk];
                const membersDict = {};
                const opsSet = new Set();
                const mainFeat = flist.find(f => f.properties.line_type === '主線') || flist[0];
                const mainProps = mainFeat.properties || {};

                /* 剝除內嵌沿革標記與標題徽章，確保統計表格與附屬統計純淨拆解 */
                const splitDesc = (descStr) => {
                    if (!descStr) return [''];
                    const withoutNar = descStr.replace(/<!--HGIS_NARRATIVE_START-->[\s\S]*?<!--HGIS_NARRATIVE_END-->/g, '');
                    const stripped = withoutNar.replace(/^<div style="margin-bottom:6px;">[\s\S]*?<\/div>/, '').trim();
                    return stripped.split(/<div[^>]*>\s*▸\s*(?:附屬統計|相關路線)：\s*([^<]+)<\/div>/);
                };

                const mainParts = splitDesc((mainProps.description && mainProps.description.zh) || '');
                const mainTableOnly = mainParts[0] ? mainParts[0].trim() : '';

                flist.forEach(f => {
                    const p = f.properties || {};
                    const rid = p.route_id || p.name;
                    const ltype = p.line_type || '主線';
                    if (p.operators) p.operators.split('、').map(s => s.trim()).filter(Boolean).forEach(op => opsSet.add(op));

                    const parts = splitDesc((p.description && p.description.zh) || '');
                    let ownTable = parts[0] ? parts[0].trim() : '';
                    let hasTable = ownTable.includes('<table');
                    if (rid !== gk && hasTable && ownTable === mainTableOnly) {
                        ownTable = '<div style="color:#777;font-size:12px;">（年報無獨立統計資料）</div>';
                        hasTable = false;
                    }
                    const ownMeta = hasTable ? extractMetaFromTableHtml(ownTable) : { operators: '' };
                    if (ownMeta.operators) {
                        ownMeta.operators.split('、').map(s => s.trim()).filter(Boolean).forEach(op => opsSet.add(op));
                    }

                    const existing = membersDict[rid];
                    const shouldReplace = !existing || (ltype === '主線') || (existing.lineType === '舊線' && ltype !== '舊線');
                    if (shouldReplace) {
                        membersDict[rid] = {
                            id: rid, lineType: ltype, badgeText: `${rid} ${ltype}`.trim(),
                            section: (p.section || '').replace(/\s*\([^)]*\)$/, ''),
                            operators: p.operators || ownMeta.operators || '',
                            tableHtml: ownTable, hasTable: hasTable, feature: f, isMain: (rid === gk)
                        };
                        routeByIdMap[rid] = f;
                    }
                });

                for (let i = 1; i < mainParts.length; i += 2) {
                    const subTitle = mainParts[i].trim();
                    const subTable = (mainParts[i + 1] || '').trim();
                    const spaceIdx = subTitle.indexOf(' ');
                    const subCode = spaceIdx > 0 ? subTitle.substring(0, spaceIdx).trim() : subTitle;
                    const subLabel = spaceIdx > 0 ? subTitle.substring(spaceIdx + 1).trim() : '副線';
                    const meta = extractMetaFromTableHtml(subTable);
                    if (meta.operators) meta.operators.split('、').map(s => s.trim()).filter(Boolean).forEach(op => opsSet.add(op));

                    if (!membersDict[subCode]) {
                        const virtualFeature = {
                            type: "Feature", _isVirtual: true,
                            properties: {
                                route_id: subCode, parent_id: gk, line_type: subLabel, name: mainProps.name,
                                tailo: mainProps.tailo || '', section: meta.section || subLabel,
                                operators: meta.operators || mainProps.operators || '', description: { zh: subTable },
                                narrative: globalNarrativesMap[subCode] || null
                            },
                            geometry: mainFeat.geometry
                        };
                        membersDict[subCode] = {
                            id: subCode, lineType: subLabel, badgeText: `${subCode} ${subLabel}`.trim(),
                            section: meta.section || subLabel, operators: meta.operators,
                            tableHtml: subTable, hasTable: subTable.includes('<table'), feature: virtualFeature, isMain: false
                        };
                        routeByIdMap[subCode] = virtualFeature;
                    }
                }

                familyMembersMap[gk] = Object.values(membersDict).sort((a, b) => {
                    if (a.isMain !== b.isMain) return a.isMain ? -1 : 1;
                    return a.id.localeCompare(b.id, undefined, { numeric: true });
                });
                familyOperatorsMap[gk] = opsSet;
            });
        }

        /* 使用動態時間戳確保每次重整皆載入最新 data.json 與 narratives */
        fetch('data.json?t=' + Date.now())
            .then(response => { if (!response.ok) throw new Error(`HTTP ${response.status}`); return response.json(); })
            .then(rawData => {
                const geoData = rawData.data || rawData;
                if (geoData.narratives && typeof geoData.narratives === 'object') {
                    globalNarrativesMap = geoData.narratives;
                } else if (rawData.narratives && typeof rawData.narratives === 'object') {
                    globalNarrativesMap = rawData.narratives;
                }

                const rawFeatures = geoData.features || [];
                const seenStations = new Set();
                const cleanFeatures = rawFeatures.filter(f => {
                    const p = f.properties || {};
                    const isPoint = f.geometry && f.geometry.type === "Point";
                    if (isPoint) {
                        const coordKey = `${p.name}_${f.geometry.coordinates.join(',')}`;
                        if (seenStations.has(coordKey)) return false;
                        seenStations.add(coordKey);
                        return true;
                    }
                    const descText = (p.description && p.description.zh) ? p.description.zh : "";
                    if (!p.route_id && /^(A\d+(-\d+)?|未命名路線|Line\s+)/i.test(p.name || "") && descText.includes("在此輸入中文歷史描述")) {
                        return false;
                    }
                    return true;
                });

                const routeFeaturesList = [];
                const stationFeaturesList = [];
                const routeGroupSeen = new Set();

                cleanFeatures.forEach(f => {
                    const p = f.properties || {};
                    if (f.geometry && f.geometry.type === "Point") {
                        stationFeaturesList.push(f);
                        searchableStations.push(f);
                    } else if (f.geometry) {
                        f._bbox = getGeometryBBox(f.geometry);
                        routeFeaturesList.push(f);
                        const groupKey = p.parent_id || p.route_id || p.name;
                        if (p.narrative && p.route_id && !globalNarrativesMap[p.route_id]) {
                            globalNarrativesMap[p.route_id] = p.narrative;
                        }
                        if (p.name && !routeKeyToNameMap[groupKey]) routeKeyToNameMap[groupKey] = p.name;
                        if (!masterRouteFeatureMap[groupKey] || p.line_type === "主線") masterRouteFeatureMap[groupKey] = f;
                        const descText = (p.description && p.description.zh) ? p.description.zh : "";
                        if (descText.includes("<table") && (!masterRouteDescMap[groupKey] || p.line_type === "主線")) masterRouteDescMap[groupKey] = descText;
                        if (p.history && p.history.length > 0 && (!masterRouteHistoryMap[groupKey] || p.line_type === "主線")) masterRouteHistoryMap[groupKey] = p.history;
                    }
                });

                buildFamilyRegistry(routeFeaturesList);

                const BBOX_PAD = 0.003;
                stationFeaturesList.forEach(st => {
                    const [px, py] = st.geometry.coordinates;
                    const boundFeatures = [];
                    const boundGroupKeys = new Set();
                    const boundRouteIds = new Set();
                    let nearestFeature = null, nearestDist = Infinity;

                    routeFeaturesList.forEach(rf => {
                        const b = rf._bbox;
                        if (b && (px < b.minX - BBOX_PAD || px > b.maxX + BBOX_PAD || py < b.minY - BBOX_PAD || py > b.maxY + BBOX_PAD)) {
                            return;
                        }
                        const d = minDistToGeometryMeters(px, py, rf.geometry);
                        if (d < nearestDist) { nearestDist = d; nearestFeature = rf; }
                        if (d <= 80) {
                            boundFeatures.push(rf);
                            const gk = rf.properties.parent_id || rf.properties.route_id || rf.properties.name;
                            const rid = rf.properties.route_id || rf.properties.name;
                            if (gk) boundGroupKeys.add(gk);
                            if (rid) boundRouteIds.add(rid);
                        }
                    });
                    if (!boundFeatures.length && nearestFeature && nearestDist <= 200) {
                        boundFeatures.push(nearestFeature);
                        const gk = nearestFeature.properties.parent_id || nearestFeature.properties.route_id || nearestFeature.properties.name;
                        const rid = nearestFeature.properties.route_id || nearestFeature.properties.name;
                        if (gk) boundGroupKeys.add(gk);
                        if (rid) boundRouteIds.add(rid);
                    }
                    st.properties._boundRouteFeatures = boundFeatures;
                    st.properties._boundGroupKeys = Array.from(boundGroupKeys);
                    st.properties._boundRouteIds = Array.from(boundRouteIds);
                });

                routeFeaturesList.forEach(f => {
                    const p = f.properties || {};
                    const groupKey = p.parent_id || p.route_id || p.name;
                    if (!routeGroupSeen.has(groupKey) && (p.line_type === "主線" || !p.line_type)) {
                        routeGroupSeen.add(groupKey);
                        searchableRoutes.push(f);
                    }
                });
                routeFeaturesList.forEach(f => {
                    const p = f.properties || {};
                    const groupKey = p.parent_id || p.route_id || p.name;
                    if (!routeGroupSeen.has(groupKey)) {
                        routeGroupSeen.add(groupKey);
                        searchableRoutes.push(f);
                    }
                });

                geojsonLayer = L.geoJSON({ type: "FeatureCollection", features: cleanFeatures }, {
                    style: feature => getLineStyle(feature, 'none', false),
                    pointToLayer: function(feature, latlng) {
                        const canInteract = hasStationHistory(feature);
                        const marker = L.circleMarker(latlng, Object.assign({}, getStationStyle(feature, false, false), { interactive: canInteract }));
                        if (feature.properties && feature.properties.name) {
                            marker.bindTooltip(feature.properties.name, { permanent: true, direction: 'top', className: 'station-label', offset: [0, -5] });
                        }
                        return marker;
                    },
                    onEachFeature: function(feature, layer) {
                        if (feature.geometry && feature.geometry.type === "Point") {
                            allStationLayers.push(layer);
                            (feature.properties._boundGroupKeys || []).forEach(k => {
                                if (!groupStationsMap[k]) groupStationsMap[k] = [];
                                groupStationsMap[k].push(layer);
                            });
                            if (hasStationHistory(feature)) {
                                layer.bindPopup(() => buildStationPopupContent(feature), { className: 'custom-popup', maxWidth: 280 });
                                layer.on('click', () => { lastFeatureClickTime = Date.now(); });
                            }
                        } else {
                            allRouteLayers.push(layer);
                            layer.on('click', () => {
                                lastFeatureClickTime = Date.now();
                                setTimeout(() => { input.blur(); syncDisplay(); }, 0);
                                highlightRouteGroup(feature, false, layer);
                            });
                        }
                    }
                }).addTo(map);

                if (geojsonLayer.getBounds().isValid()) map.fitBounds(geojsonLayer.getBounds());
                applyYearFilter();
                applyInitialUrlHash();
                document.getElementById('app-loading').style.display = 'none';
            }).catch(err => {
                console.error('HGIS data error:', err);
                const box = document.getElementById('app-loading');
                box.classList.add('load-error');
                box.innerHTML = '';
                const label = document.createElement('div'); label.textContent = '⚠️ 地圖資料載入失敗：' + err.message;
                const hint = document.createElement('div'); hint.style.cssText = 'font-size:12px;font-weight:400;margin-top:5px;';
                hint.textContent = '請確認 index.html 與 data.json 位於同一資料夾，並透過網站伺服器開啟。';
                const retry = document.createElement('button'); retry.textContent = '重新載入'; retry.onclick = () => location.reload();
                box.append(label, hint, retry);
            });

        function syncDisplay() {
            const val = input.value;
            if (val === '') {
                displayLayer.innerHTML = '<span style="color:#999; font-size:15px;">搜尋路線、編號(A1)、舊稱、業者或車站...</span>';
                return;
            }
            let safeVal = val.replace(/</g, "&lt;").replace(/>/g, "&gt;");
            const isFocused = (document.activeElement === input);
            if (!isFocused && val === activeRouteName && activeRouteSection) {
                let safeSection = activeRouteSection.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                displayLayer.innerHTML = `${safeVal} <span style="font-size:12px; color:#999; margin-left:5px;">${safeSection}</span>`;
            } else {
                displayLayer.innerHTML = safeVal;
            }
        }

        input.addEventListener('focus', function() {
            if (window.innerWidth <= 960 && yfBar.classList.contains('open')) {
                yfBar.classList.remove('open'); updateTitleText();
            }
            if (!searchBox.classList.contains('expanded')) {
                setSearchExpanded(true);
                clearBtn.style.display = 'block';
            }
            syncDisplay();
            setTimeout(() => { renderList(input.value); }, 100);
        });

        searchBox.addEventListener('click', function() {
            if (!this.classList.contains('expanded')) {
                setSearchExpanded(true);
                clearBtn.style.display = 'block';
                syncDisplay();
                renderList(input.value);
            }
        });

        input.addEventListener('blur', () => syncDisplay());

        function normalizeSearchText(s) {
            return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        }
        function compactSearchText(s) {
            return normalizeSearchText(s).replace(/[-\s]+/g, '');
        }
        function addSearchHeader(text, cls = 'search-category') {
            const head = document.createElement('div'); head.className = cls; head.textContent = text;
            dropdown.appendChild(head);
        }
        function addSearchItem(text, tag, onClick, tagClass = '') {
            const item = document.createElement('div'); item.className = 'search-item'; item.setAttribute('role', 'option');
            item.tabIndex = 0;
            const left = document.createElement('span'); left.textContent = text;
            item.appendChild(left);
            if (tag) {
                const label = document.createElement('span');
                label.className = 'match-tag' + (tagClass ? ' ' + tagClass : '');
                label.textContent = tag;
                item.appendChild(label);
            }
            item.addEventListener('click', e => { e.stopPropagation(); onClick(); });
            item.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onClick(); } });
            dropdown.appendChild(item);
            return item;
        }
        function closeSearchResults() {
            dropdown.style.display = 'none';
            input.setAttribute('aria-expanded', 'false');
            if (window.innerWidth <= 960 && !input.value.trim()) setSearchExpanded(false);
            setTimeout(() => { input.blur(); syncDisplay(); }, 0);
        }

        function renderList(val) {
            isRenderingList = true;
            syncDisplay();
            const rawTrim = String(val || '').trim();
            const keyword = normalizeSearchText(rawTrim);
            const compactKey = compactSearchText(rawTrim);
            dropdown.replaceChildren();
            clearBtn.style.display = 'block';

            const pool = searchableRoutes.filter(f => isRouteFeatureActiveInYear(f, currentFilterYear));

            if (!keyword) {
                if (!pool.length) {
                    dropdown.style.display = 'none';
                    input.setAttribute('aria-expanded', 'false');
                    isRenderingList = false;
                    return;
                }
                dropdown.style.display = 'block';
                input.setAttribute('aria-expanded', 'true');
                addSearchItem('🎲 隨機探索一條路線', currentFilterYear === 'all' ? '' : `${currentFilterYear} 年`, () => {
                    const chosen = pool[Math.floor(Math.random() * pool.length)];
                    closeSearchResults(); highlightRouteGroup(chosen, true);
                }).classList.add('random-item');

                const sortedByTailo = pool.slice().sort((a, b) => {
                    const ta = compactSearchText(a.properties.tailo || a.properties.name || '');
                    const tb = compactSearchText(b.properties.tailo || b.properties.name || '');
                    return ta.localeCompare(tb) || String(a.properties.route_id || '').localeCompare(String(b.properties.route_id || ''), undefined, { numeric: true });
                });

                let currentLetter = '';
                sortedByTailo.forEach(f => {
                    const p = f.properties || {};
                    const cleanTailo = normalizeSearchText(p.tailo || '');
                    const firstChar = (cleanTailo.match(/[a-z]/i) || ['#'])[0].toUpperCase();
                    if (firstChar !== currentLetter) {
                        currentLetter = firstChar;
                        addSearchHeader(currentLetter, 'search-letter-header');
                    }
                    const code = p.parent_id || p.route_id || '';
                    const section = (p.section || '').replace(/\s*\([^)]*\)$/, '');
                    addSearchItem(
                        `${p.name || '未命名'}${section ? '（' + (section.length > 14 ? section.slice(0, 14) + '…' : section) + '）' : ''}`,
                        code,
                        () => { closeSearchResults(); highlightRouteGroup(f, true); },
                        'code'
                    );
                });
                isRenderingList = false;
                return;
            }

            const results = [];
            pool.forEach(f => {
                const p = f.properties || {};
                const gk = p.parent_id || p.route_id || '';
                const code = normalizeSearchText(gk);
                const name = normalizeSearchText(p.name);
                const tai = normalizeSearchText(p.tailo);
                const taiCompact = compactSearchText(p.tailo);
                const alt = normalizeSearchText(p.alt_names);
                const ops = normalizeSearchText(p.operators);
                const narObj = p.narrative || globalNarrativesMap[gk] || null;
                const narText = narObj ? normalizeSearchText([narObj.sectionText, narObj.openDate, ...(narObj.paragraphs || [])].join(' ')) : '';

                let rank = 99, matchHint = '';

                if (code === keyword) rank = 0;
                else if (name === keyword) rank = 1;
                else if (code.startsWith(keyword)) rank = 2;
                else if (name.startsWith(keyword)) rank = 3;
                else if (code.includes(keyword) || name.includes(keyword)) rank = 4;
                else if (tai.includes(keyword) || (compactKey && taiCompact.includes(compactKey))) {
                    rank = 5; matchHint = p.tailo || '';
                } else if (alt.includes(keyword)) {
                    rank = 5; matchHint = `舊稱: ${p.alt_names}`;
                } else if (ops.includes(keyword)) {
                    rank = 6;
                } else if (narText && narText.includes(keyword)) {
                    rank = 7; matchHint = '📖 沿革提及';
                } else return;

                results.push({ f, rank, code: gk, matchHint });
            });
            results.sort((a, b) => a.rank - b.rank || String(a.code).localeCompare(String(b.code), undefined, { numeric: true }));

            const ops = Array.from(new Set(Object.values(familyOperatorsMap).flatMap(set => Array.from(set))))
                .filter(op => normalizeSearchText(op).includes(keyword))
                .sort((a, b) => normalizeSearchText(a) === keyword ? -1 : normalizeSearchText(b) === keyword ? 1 : a.localeCompare(b, 'zh-Hant'))
                .slice(0, 20);

            const stations = allStationLayers.filter(st =>
                isStationFeatureActiveInYear(st.feature, currentFilterYear) &&
                normalizeSearchText(st.feature.properties.name).includes(keyword)).slice(0, 30);

            if (!results.length && !ops.length && !stations.length) {
                addSearchHeader('沒有符合的結果，請試試舊稱、台羅拼音、編號或業者名稱');
                dropdown.style.display = 'block';
                input.setAttribute('aria-expanded', 'true');
                isRenderingList = false;
                return;
            }

            dropdown.style.display = 'block';
            input.setAttribute('aria-expanded', 'true');

            if (ops.length) {
                addSearchHeader(`🏢 業者（${ops.length}）`);
                ops.forEach(op => addSearchItem(`🏢 ${op}`, '查看所轄路線', () => { closeSearchResults(); filterByOperator(op); }));
            }
            if (results.length) {
                addSearchHeader(`🛤️ 路線（${results.length}）`);
                results.forEach(({ f, matchHint }) => {
                    const p = f.properties || {};
                    const section = matchHint || (p.section || '').replace(/\s*\([^)]*\)$/, '');
                    addSearchItem(
                        `${p.parent_id || p.route_id || ''} ${p.name || '未命名'}`,
                        section.length > 24 ? section.slice(0, 24) + '…' : section,
                        () => { closeSearchResults(); highlightRouteGroup(f, true); }
                    );
                });
            }
            if (stations.length) {
                addSearchHeader(`🚉 車站（最多顯示 ${stations.length} 站）`);
                stations.forEach(stLayer => {
                    const f = stLayer.feature;
                    const groupKeys = f.properties._boundGroupKeys || [];
                    const ids = f.properties._boundRouteIds || [];
                    addSearchItem(
                        `🚉 ${f.properties.name || '車站'}`,
                        groupKeys.length ? (routeKeyToNameMap[groupKeys[0]] || groupKeys[0]) : '',
                        () => {
                            closeSearchResults();
                            if (!showStations) setStationsVisibility(true);
                            const feat = (ids.length && routeByIdMap[ids[0]]) || (groupKeys.length && masterRouteFeatureMap[groupKeys[0]]);
                            if (feat) highlightRouteGroup(feat, false);
                            if (!map.hasLayer(stLayer)) stLayer.addTo(map);
                            const pt = map.project(stLayer.getLatLng(), 15);
                            const shift = window.innerWidth > 960 ? L.point(pt.x + getDrawerWidth() / 2, pt.y) : L.point(pt.x, pt.y + window.innerHeight * 0.22);
                            map.flyTo(map.unproject(shift, 15), 15, { duration: 0.8 });
                            if (stLayer.getPopup()) setTimeout(() => stLayer.openPopup(), 450);
                        },
                        'st'
                    );
                });
            }
            isRenderingList = false;
        }

        input.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                dropdown.style.display = 'none';
                input.setAttribute('aria-expanded', 'false');
                input.blur();
                if (!input.value.trim()) setSearchExpanded(false);
                return;
            }
            if (e.key === 'ArrowDown' && dropdown.style.display === 'block') {
                e.preventDefault();
                const first = dropdown.querySelector('.search-item');
                if (first) first.focus();
            }
        });

        dropdown.addEventListener('keydown', e => {
            if (!['ArrowDown', 'ArrowUp', 'Escape'].includes(e.key)) return;
            e.preventDefault();
            if (e.key === 'Escape') { input.focus(); dropdown.style.display = 'none'; return; }
            const options = Array.from(dropdown.querySelectorAll('.search-item'));
            const i = options.indexOf(document.activeElement);
            const next = options[Math.max(0, Math.min(options.length-1, i + (e.key === 'ArrowDown' ? 1 : -1)))];
            if (next) next.focus();
        });

        input.oninput = function() {
            if (this.value !== activeRouteName) { activeRouteName = ''; activeRouteSection = ''; }
            syncDisplay();
            renderList(this.value);
        };

        clearBtn.onclick = function(e) {
            e.stopPropagation();
            if (input.value.length > 0 || selectedGroupKey !== null || activeOperatorFilter !== null) {
                clearRouteSelection();
                if (window.innerWidth > 960) input.focus();
            } else {
                setSearchExpanded(false);
                dropdown.style.display = 'none';
                this.style.display = 'none';
            }
        };

        document.addEventListener('click', function(e) {
            if (!searchBox.contains(e.target)) {
                dropdown.style.display = 'none';
                input.setAttribute('aria-expanded', 'false');
                if (input.value.trim() === '') setSearchExpanded(false);
            }
        });

        map.on('click', function() {
            if (Date.now() - lastFeatureClickTime < 250) return;
            dropdown.style.display = 'none';
            input.setAttribute('aria-expanded', 'false');
            if (selectedGroupKey !== null || activeOperatorFilter !== null) {
                clearRouteSelection();
            } else if (input.value.trim() === '') {
                setSearchExpanded(false);
            }
        });

        dropdown.addEventListener('scroll', function() {
            if (!isRenderingList) input.blur();
        }, { passive: true });
    </script>
</body>
</html>

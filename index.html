    <!-- 🔍 全螢幕照片放大鏡 -->
    <div id="photo-lightbox" onclick="closeLightbox()">
        <button id="lightbox-close">&times;</button>
        <img id="lightbox-img" src="" alt="放大歷史照片" onclick="event.stopPropagation()">
        <div id="lightbox-caption" onclick="event.stopPropagation()"></div>
    </div>

    <div id="toast-msg"></div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        const sysTitle = document.getElementById('system-title');
        const yfBar = document.getElementById('year-filter-bar');
        const infoDrawer = document.getElementById('info-drawer');
        const mapLegend = document.getElementById('map-legend');
        const opBanner = document.getElementById('operator-banner');

        [sysTitle, yfBar, infoDrawer, mapLegend, opBanner].forEach(el => {
            L.DomEvent.disableClickPropagation(el);
            L.DomEvent.disableScrollPropagation(el);
        });

        const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' });
        const sinica1904 = L.tileLayer('https://gis.sinica.edu.tw/tileserver/file-exists.php?img=JM20K_1904-jpg-{z}-{x}-{y}', { maxZoom: 18, opacity: 0.85 });

        const myRenderer = L.canvas({ tolerance: 15 }); 
        const map = L.map('map', {
            renderer: myRenderer,
            layers: [osm],
            zoomControl: false
        }).setView([23.6978, 120.9605], 7);

        L.control.zoom({ position: 'bottomleft' }).addTo(map);
        L.control.layers(
            { "現代地圖 (OSM)": osm },
            { "1904 臺灣堡圖": sinica1904 },
            { position: 'bottomright', collapsed: true }
        ).addTo(map);

        let geojsonLayer;
        let allRouteLayers = [];
        let allStationLayers = [];
        let searchableRoutes = [];
        let searchableStations = [];
        let masterRouteDescMap = {};
        let masterRouteHistoryMap = {};
        let masterRouteFeatureMap = {};
        let routeByIdMap = {}; // route_id -> feature (含主線、副線與虛擬內嵌子路線)
        let familyMembersMap = {}; // groupKey -> [ { id, badgeText, section, operators, tableHtml, feature, isMain } ]
        let familyOperatorsMap = {}; // groupKey -> Set of all operators across main & sub-routes
        let groupStationsMap = {}; 
        let routeKeyToNameMap = {};

        let activeRouteName = '';
        let activeRouteSection = '';
        let selectedGroupKey = null;
        let activeOperatorFilter = null;
        let currentDrawerFeature = null;
        let isRenderingList = false;

        let currentFilterYear = 'all';
        let yearFilterMode = 'hide';
        let showStations = true;
        let hiddenLineTypes = new Set();
        let lastFeatureClickTime = 0;

        function showToast(text) {
            const t = document.getElementById('toast-msg');
            t.textContent = text;
            t.style.display = 'block';
            clearTimeout(t._timer);
            t._timer = setTimeout(() => { t.style.display = 'none'; }, 2600);
        }

        function updateTitleText() {
            if (currentFilterYear !== 'all' && !yfBar.classList.contains('open')) {
                sysTitle.textContent = `古今鐵道營業線 HGIS 查詢・${currentFilterYear}年`;
            } else {
                sysTitle.textContent = `古今鐵道營業線 HGIS 查詢`;
            }
        }

        sysTitle.addEventListener('click', function(e) {
            e.stopPropagation();
            yfBar.classList.toggle('open');
            updateTitleText();
        });

        document.getElementById('drawerHandle').addEventListener('click', function() {
            infoDrawer.classList.toggle('full-mobile');
        });

        function getEraName(y) {
            if (y < 1912) return `明治${y - 1867}年`;
            if (y === 1912) return `明治45/大正元年`;
            if (y < 1926) return `大正${y - 1911}年`;
            if (y === 1926) return `大正15/昭和元年`;
            return `昭和${y - 1925}年`;
        }

        const yearSelect = document.getElementById('yearSelect');
        const prevYearBtn = document.getElementById('prevYearBtn');
        const nextYearBtn = document.getElementById('nextYearBtn');
        const yearModeSelect = document.getElementById('yearModeSelect');
        const yearResetBtn = document.getElementById('yearResetBtn');

        const MIN_YEAR = 1909;
        const MAX_YEAR = 1941;
        for (let y = MIN_YEAR; y <= MAX_YEAR; y++) {
            const opt = document.createElement('option');
            opt.value = String(y);
            opt.textContent = `${y} (${getEraName(y)})`;
            yearSelect.appendChild(opt);
        }

        function setStationsVisibility(visible) {
            showStations = visible;
            const lgSt = document.getElementById('lg-st');
            if (showStations) {
                lgSt.classList.remove('muted');
                if (map.getZoom() >= 14) document.getElementById('map').classList.add('zoom-labels');
            } else {
                lgSt.classList.add('muted');
                document.getElementById('map').classList.remove('zoom-labels');
                allStationLayers.forEach(stLayer => stLayer.closePopup());
            }
            applyYearFilter();
        }

        function toggleLineType(typeKey) {
            if (hiddenLineTypes.has(typeKey)) {
                hiddenLineTypes.delete(typeKey);
            } else {
                hiddenLineTypes.add(typeKey);
            }
            document.getElementById('lg-main').classList.toggle('muted', hiddenLineTypes.has('主線'));
            document.getElementById('lg-old').classList.toggle('muted', hiddenLineTypes.has('舊線'));
            document.getElementById('lg-sub').classList.toggle('muted', hiddenLineTypes.has('副線'));
            applyYearFilter();
        }

        const opacityBox = document.getElementById('opacity-box');
        const opacitySlider = document.getElementById('opacitySlider');
        const opacityVal = document.getElementById('opacityVal');

        opacitySlider.addEventListener('input', function() {
            const v = parseInt(this.value, 10);
            sinica1904.setOpacity(v / 100);
            opacityVal.textContent = `${v}%`;
        });

        map.on('overlayadd', function(e) {
            if (e.layer === sinica1904) opacityBox.style.display = 'flex';
        });
        map.on('overlayremove', function(e) {
            if (e.layer === sinica1904) opacityBox.style.display = 'none';
        });

        map.on('zoomend', function() {
            const z = map.getZoom();
            const mapEl = document.getElementById('map');
            if (z >= 14 && showStations) {
                mapEl.classList.add('zoom-labels');
            } else {
                mapEl.classList.remove('zoom-labels');
            }
            applyYearFilter();
        });

        function pointToSegmentDistMeters(px, py, x1, y1, x2, y2) {
            const kx = 111320 * Math.cos(py * Math.PI / 180);
            const ky = 110574;
            const dx = (x2 - x1) * kx;
            const dy = (y2 - y1) * ky;
            if (dx === 0 && dy === 0) return Math.hypot((px - x1) * kx, (py - y1) * ky);
            let t = (((px - x1) * kx) * dx + ((py - y1) * ky) * dy) / (dx * dx + dy * dy);
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(px * kx - (x1 * kx + t * dx), py * ky - (y1 * ky + t * dy));
        }

        function minDistToGeometryMeters(px, py, geom) {
            if (!geom) return Infinity;
            let minD = Infinity;
            const checkLine = (coords) => {
                for (let i = 0; i < coords.length - 1; i++) {
                    const d = pointToSegmentDistMeters(px, py, coords[i][0], coords[i][1], coords[i+1][0], coords[i+1][1]);
                    if (d < minD) minD = d;
                }
            };
            if (geom.type === "LineString") checkLine(geom.coordinates);
            else if (geom.type === "MultiLineString") geom.coordinates.forEach(line => checkLine(line));
            return minD;
        }

        function isLineTypeHidden(feature) {
            const t = (feature.properties && feature.properties.line_type) || "主線";
            if (t === "舊線") return hiddenLineTypes.has("舊線");
            if (t === "副線" || t.includes("支線")) return hiddenLineTypes.has("副線");
            return hiddenLineTypes.has("主線");
        }

        function isRouteFeatureActiveInYear(feature, yearStr) {
            if (yearStr === 'all') return true;
            const yr = parseInt(yearStr, 10);
            const p = feature.properties || {};
            const groupKey = p.parent_id || p.route_id || p.name;

            const hist = (p.history && p.history.length > 0) ? p.history : (masterRouteHistoryMap[groupKey] || []);
            if (hist.length > 0) {
                return hist.some(h => yr >= parseInt(h.startYear, 10) && yr <= parseInt(h.endYear, 10));
            }
            if (p.period && p.period !== '未知') {
                const m = p.period.match(/(\d{4})\D+(\d{4})/);
                if (m) return yr >= parseInt(m[1], 10) && yr <= parseInt(m[2], 10);
                const mSingle = p.period.match(/(\d{4})/);
                if (mSingle) return yr === parseInt(mSingle[1], 10);
            }
            return false;
        }

        function isStationFeatureActiveInYear(stFeature, yearStr) {
            if (yearStr === 'all') return true;
            const yr = parseInt(yearStr, 10);
            const p = stFeature.properties || {};

            if (p.period && p.period !== '未知') {
                const m = p.period.match(/(\d{4})\D+(\d{4})/);
                if (m) return yr >= parseInt(m[1], 10) && yr <= parseInt(m[2], 10);
                const mSingle = p.period.match(/(\d{4})/);
                if (mSingle) return yr === parseInt(mSingle[1], 10);
            }
            const boundFeatures = p._boundRouteFeatures || [];
            if (boundFeatures.length > 0) {
                return boundFeatures.some(rf => isRouteFeatureActiveInYear(rf, yearStr));
            }
            return false;
        }

        // 判斷車站是否已具備實質沿革資料（未匯入車站沿革前預設為 false，讓點擊直接穿透給底下的路線）
        function hasStationHistory(feature) {
            const p = (feature && feature.properties) || {};
            if (p.history && Array.isArray(p.history) && p.history.length > 0) return true;
            const desc = (p.description && p.description.zh) ? p.description.zh.trim() : "";
            if (desc && !desc.includes("在此輸入中文歷史描述") && desc !== `【車站】${p.name}`) {
                return true;
            }
            return false;
        }

        // 單一匹配規則：比對該路線或其家族成員是否包含指定經營者
        function isOperatorRouteMatch(feature, opName = activeOperatorFilter) {
            if (!opName) return false;
            const p = feature.properties || {};
            const groupKey = p.parent_id || p.route_id || p.name;
            if (p.operators && p.operators.split('、').some(name => name.trim() === opName)) {
                return true;
            }
            const famOps = familyOperatorsMap[groupKey];
            if (famOps && famOps.has(opName)) {
                // 若路線本身無獨立經營者記載，或屬於主線，則沿用家族經營者集合
                if (!p.operators || p.route_id === groupKey) return true;
            }
            const master = masterRouteFeatureMap[groupKey] || feature;
            const operators = (master.properties && master.properties.operators) || '';
            return operators.split('、').some(name => name.trim() === opName);
        }

        function getLineStyle(feature, isSelected = false, isOperatorMatch = false) {
            const p = feature.properties || {};
            const type = p.line_type || "";
            const isActiveYear = isRouteFeatureActiveInYear(feature, currentFilterYear);
            const isLowZoom = map.getZoom() <= 10;

            if (isSelected) {
                return {
                    color: "#e53935",
                    weight: (type === "主線" || !type) ? 7 : 5,
                    opacity: 1,
                    dashArray: type === "舊線" ? '6, 6' : null
                };
            }
            if (isOperatorMatch || isOperatorRouteMatch(feature)) {
                return {
                    color: "#7b1fa2",
                    weight: (type === "主線" || !type) ? 6 : 4.5,
                    opacity: 0.95,
                    dashArray: type === "舊線" ? '6, 6' : null
                };
            }
            if (activeOperatorFilter) {
                return { color: "#bdbdbd", weight: 2, opacity: 0.25, dashArray: null };
            }
            if (!isActiveYear && yearFilterMode === 'dim') {
                return { color: "#9e9e9e", weight: 2, opacity: 0.22, dashArray: null };
            }

            const baseW = isLowZoom ? 2.5 : 4;
            if (type === "舊線") {
                return { color: "#222222", weight: isLowZoom ? 2 : 3, opacity: 0.85, dashArray: '5, 5' };
            } else if (type === "副線" || type.includes("支線")) {
                return { color: "#3949ab", weight: isLowZoom ? 2.2 : 3.5, opacity: 0.85, dashArray: null };
            } else {
                return { color: "#ff7800", weight: baseW, opacity: 0.85, dashArray: null };
            }
        }

        function getStationStyle(stFeature, isSelectedRoute = false) {
            const isActiveYear = isStationFeatureActiveInYear(stFeature, currentFilterYear);
            if (isSelectedRoute) {
                return { radius: 5.5, fillColor: "#fff59d", color: "#d32f2f", weight: 2.5, opacity: 1, fillOpacity: 1 };
            }
            if ((!isActiveYear && yearFilterMode === 'dim') || activeOperatorFilter) {
                return { radius: 3.5, fillColor: "#eeeeee", color: "#9e9e9e", weight: 1, opacity: 0.25, fillOpacity: 0.25 };
            }
            return { radius: 4.5, fillColor: "#ffffff", color: "#1a237e", weight: 2, opacity: 1, fillOpacity: 1 };
        }

        function loadRoutePhoto(feature) {
            const p = feature.properties || {};
            const photoBox = document.getElementById('drawer-photo-box');
            const photoImg = document.getElementById('drawer-photo-img');
            const photoCap = document.getElementById('drawer-photo-caption');
            const photoSrc = document.getElementById('drawer-photo-source');
            const demoBtn = document.getElementById('demoPhotoBtn');

            photoBox.style.display = 'none';
            demoBtn.style.display = 'inline-flex';

            if (p.photos && Array.isArray(p.photos) && p.photos.length > 0) {
                const item = p.photos[0];
                photoImg.src = item.url;
                photoCap.textContent = item.caption || `${p.name} 歷史影像`;
                photoSrc.textContent = item.source ? `出處：${item.source}` : (item.year || '');
                photoBox.style.display = 'block';
                demoBtn.style.display = 'none';
                return;
            }
            if (p.photo) {
                photoImg.src = p.photo;
                photoCap.textContent = p.photo_caption || `${p.name} 歷史影像`;
                photoSrc.textContent = p.photo_source || '';
                photoBox.style.display = 'block';
                demoBtn.style.display = 'none';
                return;
            }

            const candidates = [];
            if (p.route_id) candidates.push(`photos/${p.route_id}.jpg`, `photos/${p.route_id}.png`);
            if (p.parent_id && p.parent_id !== p.route_id) candidates.push(`photos/${p.parent_id}.jpg`, `photos/${p.parent_id}.png`);

            function tryNext(idx) {
                if (idx >= candidates.length) return;
                const testImg = new Image();
                testImg.onload = function() {
                    if (currentDrawerFeature !== feature) return;
                    photoImg.src = candidates[idx];
                    photoCap.textContent = `${p.name} 歷史影像`;
                    photoSrc.textContent = p.route_id || '';
                    photoBox.style.display = 'block';
                    demoBtn.style.display = 'none';
                };
                testImg.onerror = () => tryNext(idx + 1);
                testImg.src = candidates[idx];
            }
            tryNext(0);
        }

        function triggerDemoPhoto() {
            if (!currentDrawerFeature) return;
            const p = currentDrawerFeature.properties || {};
            const canvas = document.createElement('canvas');
            canvas.width = 800; canvas.height = 500;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createLinearGradient(0, 0, 0, 500);
            grad.addColorStop(0, '#d7ccc8'); grad.addColorStop(0.6, '#bcaaa4'); grad.addColorStop(1, '#8d6e63');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, 800, 500);

            ctx.fillStyle = '#6d4c41';
            ctx.beginPath();
            ctx.moveTo(0, 310); ctx.lineTo(220, 170); ctx.lineTo(480, 290); ctx.lineTo(680, 190); ctx.lineTo(800, 280); ctx.lineTo(800, 310);
            ctx.fill();

            ctx.strokeStyle = '#3e2723'; ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(360, 310); ctx.lineTo(140, 500);
            ctx.moveTo(440, 310); ctx.lineTo(660, 500);
            ctx.stroke();

            ctx.lineWidth = 4;
            for (let i = 0; i <= 10; i++) {
                const y = 320 + i * 18, spread = 45 + i * 22;
                ctx.beginPath(); ctx.moveTo(400 - spread, y); ctx.lineTo(400 + spread, y); ctx.stroke();
            }

            ctx.strokeStyle = '#4e342e'; ctx.lineWidth = 12; ctx.strokeRect(18, 18, 764, 464);

            ctx.fillStyle = '#3e2723';
            ctx.font = 'bold 34px "Microsoft JhengHei", serif';
            ctx.fillText(`【歷史寫真預覽】${p.name || '輕便鐵道'}`, 45, 75);
            ctx.font = '22px "Microsoft JhengHei", serif';
            ctx.fillText(`編號：${p.route_id || p.parent_id || '台車線'} ｜ 區間：${(p.section || '').replace(/\s*\([^)]*\)$/, '') || '歷史區間'}`, 45, 115);
            ctx.font = '18px "Microsoft JhengHei", serif';
            ctx.fillStyle = '#4e342e';
            ctx.fillText(`💡 未來只需將照片命名為 photos/${p.route_id || p.parent_id || 'A1'}.jpg 上傳至 GitHub，即會自動取代此預覽圖！`, 45, 455);

            const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
            const photoBox = document.getElementById('drawer-photo-box');
            const photoImg = document.getElementById('drawer-photo-img');
            photoImg.src = dataUrl;
            document.getElementById('drawer-photo-caption').textContent = `${p.name}（老照片展板模擬預覽，點擊可開啟全螢幕放大鏡）`;
            document.getElementById('drawer-photo-source').textContent = `檔名規則：photos/${p.route_id || p.parent_id || 'A1'}.jpg`;
            photoBox.style.display = 'block';
        }

        function openLightbox() {
            const src = document.getElementById('drawer-photo-img').src;
            const cap = document.getElementById('drawer-photo-caption').textContent;
            if (!src) return;
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox-caption').textContent = cap;
            document.getElementById('photo-lightbox').classList.add('open');
        }

        function closeLightbox() {
            document.getElementById('photo-lightbox').classList.remove('open');
        }

        // 將表格欄位「經營者」改為「業者」、「路線名」改為「線名」，並套用年份黃底標示
        function formatTableHtml(htmlStr) {
            if (!htmlStr) return '';
            let out = htmlStr
                .replace(/(<th[^>]*>)\s*經營者\s*(<\/th>)/g, '$1業者$2')
                .replace(/(<th[^>]*>)\s*路線名\s*(<\/th>)/g, '$1線名$2');

            if (currentFilterYear !== 'all') {
                const yr = parseInt(currentFilterYear, 10);
                out = out.replace(/<tr>\s*<td([^>]*)>(\d{4})(?:[–~-](\d{4}))?<\/td>/g, (match, tdAttr, y1, y2) => {
                    const start = parseInt(y1, 10);
                    const end = y2 ? parseInt(y2, 10) : start;
                    if (yr >= start && yr <= end) {
                        const rangeText = y2 ? `${y1}–${y2}` : `${y1}`;
                        return `<tr class="active-year-row"><td${tdAttr}>★ ${rangeText}</td>`;
                    }
                    return match;
                });
            }
            return out;
        }

        // 切換同家族內的主線或相關路線（支援從 C5 切到 C5-1，以及從 C5-1 切回 C5）
        window.switchFamilyMember = function(groupKey, targetMemberId) {
            const famList = familyMembersMap[groupKey] || [];
            const targetMember = famList.find(m => m.id === targetMemberId);
            if (!targetMember || !targetMember.feature) return;

            openRouteDrawer(targetMember.feature, true);
        };

        function openRouteDrawer(feature, shouldScrollTop = false) {
            currentDrawerFeature = feature;
            const p = feature.properties || {};
            const groupKey = p.parent_id || p.route_id || p.name;
            const currentId = p.route_id || p.name;
            const famList = familyMembersMap[groupKey] || [];
            const currentMember = famList.find(m => m.id === currentId);
            const mainMember = famList.find(m => m.isMain) || famList[0];

            const badgeText = currentMember ? currentMember.badgeText : `${p.route_id || groupKey} ${p.line_type || '主線'}`.trim();
            document.getElementById('drawer-badge').textContent = badgeText;
            document.getElementById('drawer-title').textContent = p.name || '未命名路線';
            document.getElementById('drawer-tailo').textContent = p.tailo || '';

            // 若目前檢視的是子路線（例如 C5-1 副線），於頂部提供「↩ 返回 C5 主線」快速按鈕
            const backMainBtn = document.getElementById('drawer-back-main-btn');
            if (mainMember && currentId !== mainMember.id) {
                backMainBtn.style.display = 'inline-block';
                backMainBtn.textContent = `↩ 返回 ${mainMember.badgeText}`;
                backMainBtn.onclick = () => window.switchFamilyMember(groupKey, mainMember.id);
            } else {
                backMainBtn.style.display = 'none';
            }

            const rawSec = (currentMember && currentMember.section) ? currentMember.section : (p.section || '');
            const cleanSec = rawSec.replace(/\s*\([^)]*\)$/, '');
            document.getElementById('drawer-section').textContent = cleanSec ? `區間：${cleanSec}` : '';

            // 同步左上角搜尋框顯示之區間
            activeRouteName = p.name || '未命名';
            activeRouteSection = cleanSec;
            if (selectedGroupKey === groupKey) {
                input.value = activeRouteName;
                syncDisplay();
            }

            loadRoutePhoto(feature);

            // 歷年經營者（優先顯示當前路線之經營者，若無則顯示主線經營者）
            const opsBlock = document.getElementById('drawer-ops-block');
            const opsList = document.getElementById('drawer-ops-list');
            opsList.innerHTML = '';
            const masterFeat = masterRouteFeatureMap[groupKey] || feature;
            const opsStr = (currentMember && currentMember.operators) || p.operators || (masterFeat.properties && masterFeat.properties.operators) || '';
            const opsArr = opsStr ? opsStr.split('、').map(s => s.trim()).filter(Boolean) : [];

            if (opsArr.length > 0) {
                opsBlock.style.display = 'block';
                opsArr.forEach(opName => {
                    const chip = document.createElement('span');
                    chip.className = 'op-chip';
                    chip.innerHTML = `🏢 ${opName}`;
                    chip.onclick = () => filterByOperator(opName);
                    opsList.appendChild(chip);
                });
            } else {
                opsBlock.style.display = 'none';
            }

            // 沿線車站
            const stBlock = document.getElementById('drawer-stations-block');
            const stList = document.getElementById('drawer-stations-list');
            stList.innerHTML = '';
            const boundStLayers = groupStationsMap[groupKey] || [];

            if (boundStLayers.length > 0) {
                stBlock.style.display = 'block';
                document.getElementById('drawer-stations-title').textContent = `🚉 沿線車站（共 ${boundStLayers.length} 站，點擊飛往定位）`;
                boundStLayers.forEach(stLayer => {
                    const stName = stLayer.feature.properties.name || '車站';
                    const chip = document.createElement('span');
                    chip.className = 'st-chip';
                    chip.textContent = stName;
                    chip.onclick = () => {
                        if (!showStations) setStationsVisibility(true);
                        if (!map.hasLayer(stLayer)) stLayer.addTo(map);
                        const targetLatLng = stLayer.getLatLng();
                        const targetZoom = Math.max(map.getZoom(), 15);
                        const isDesktop = window.innerWidth > 768;
                        const pt = map.project(targetLatLng, targetZoom);
                        const offsetPt = isDesktop ? L.point(pt.x + 195, pt.y) : L.point(pt.x, pt.y + window.innerHeight * 0.22);
                        map.flyTo(map.unproject(offsetPt, targetZoom), targetZoom, { duration: 0.8 });
                        if (stLayer.getPopup()) {
                            setTimeout(() => stLayer.openPopup(), 450);
                        }
                    };
                    stList.appendChild(chip);
                });
            } else {
                stBlock.style.display = 'none';
            }

            // 📜 統計沿革（當前路線表格置頂 ＋ 同家族其他「相關路線」藍底白字可點擊切換並列）
            let combinedHtml = '';
            if (currentMember && currentMember.tableHtml) {
                combinedHtml += formatTableHtml(currentMember.tableHtml);
            } else {
                let rawDesc = (p.description && p.description.zh) ? p.description.zh : "";
                rawDesc = rawDesc.replace(/<div style=\"margin-bottom:6px;\"><span style=\"background:#1a237e;[\s\S]*?<\/div>/, '');
                combinedHtml += formatTableHtml(rawDesc) || '<div style="color:#777;font-size:12px;">（年報無統計資料之專用線／待考路線）</div>';
            }

            // 找出同家族中其他具備統計表的路線（例如在 C5 下顯示 C5-1~3；在 C5-1 下顯示 C5 主線、C5-2、C5-3）
            const relatedMembers = famList.filter(m => m.id !== currentId && (m.hasTable || m.isMain));
            relatedMembers.forEach(rm => {
                const secHint = rm.section ? `<span style="font-weight:normal;font-size:11.5px;color:#555;margin-left:6px;">${rm.section.replace(/\s*\([^)]*\)$/, '')}</span>` : '';
                combinedHtml += `
                    <div style="font-weight:bold;font-size:12px;color:#3949ab;margin-top:14px;margin-bottom:4px;display:flex;align-items:center;flex-wrap:wrap;">
                        <span>▸ 相關路線：</span>
                        <span class="route-badge clickable-route-badge" style="margin-left:4px;" onclick="switchFamilyMember('${groupKey}', '${rm.id}')" title="點擊切換至此路線">${rm.badgeText}</span>
                        ${secHint}
                    </div>
                    ${formatTableHtml(rm.tableHtml)}
                `;
            });

            document.getElementById('drawer-table-container').innerHTML = combinedHtml || '<div style="color:#777;">尚無詳細沿革紀錄</div>';
            document.body.classList.add('drawer-open');
            if (shouldScrollTop) {
                document.getElementById('drawerBody').scrollTo({ top: 0, behavior: 'smooth' });
            }
            updateUrlHash();
        }

        function filterByOperator(opName) {
            activeOperatorFilter = opName;
            selectedGroupKey = null;
            const opBounds = L.latLngBounds();
            const matchGroupSet = new Set();

            allRouteLayers.forEach(layer => {
                if (!isOperatorRouteMatch(layer.feature, opName)) return;
                const p = layer.feature.properties || {};
                matchGroupSet.add(p.parent_id || p.route_id || p.name);
                if (layer.getBounds) opBounds.extend(layer.getBounds());
            });

            document.getElementById('operator-banner-text').textContent = `🏢 ${opName}（共經營 ${matchGroupSet.size} 條路線）`;
            opBanner.style.display = 'flex';

            applyYearFilter();
            if (opBounds.isValid()) {
                const isDesktop = window.innerWidth > 768;
                const drawerOpen = document.body.classList.contains('drawer-open');
                map.fitBounds(opBounds, {
                    paddingTopLeft: [50, 70],
                    paddingBottomRight: (isDesktop && drawerOpen) ? [420, 50] : [50, 60]
                });
            }
            showToast(`已顯示「${opName}」所轄台車路線`);
        }

        function buildStationPopupContent(feature) {
            const p = feature.properties || {};
            const boundKeys = p._boundGroupKeys || [];
            const routeButtons = boundKeys.map(k => {
                const rName = routeKeyToNameMap[k] || k;
                return `<span class="route-badge" style="margin-right:4px;margin-top:4px;cursor:pointer;" onclick="selectRouteByGroupKey('${k}')">🛤️ ${rName}</span>`;
            }).join('');
            const desc = (p.description && p.description.zh) ? `<div style="margin-top:6px;font-size:12.5px;color:#333;">${p.description.zh}</div>` : '';
            return `
                <div style="font-size:15px;font-weight:bold;color:#1a237e;">🚉 ${p.name || '未命名車站'}</div>
                ${desc}
                ${routeButtons ? `<div style="margin-top:5px;font-size:12px;color:#555;">點擊查看所屬路線：<br>${routeButtons}</div>` : ''}
            `;
        }

        window.selectRouteByGroupKey = function(groupKey) {
            const targetFeat = masterRouteFeatureMap[groupKey];
            if (targetFeat) {
                map.closePopup();
                highlightRouteGroup(targetFeat, true, null);
            }
        };

        function applyYearFilter() {
            const isAll = (currentFilterYear === 'all');
            prevYearBtn.disabled = isAll || parseInt(currentFilterYear, 10) <= MIN_YEAR;
            nextYearBtn.disabled = isAll || parseInt(currentFilterYear, 10) >= MAX_YEAR;
            yearModeSelect.style.display = isAll ? 'none' : 'inline-block';
            yearResetBtn.style.display = isAll ? 'none' : 'inline-block';
            updateTitleText();
            updateUrlHash();

            const isLowZoom = map.getZoom() <= 10;
            const operatorGroupKeys = new Set();
            if (activeOperatorFilter) {
                allRouteLayers.forEach(layer => {
                    if (!isOperatorRouteMatch(layer.feature)) return;
                    const p = layer.feature.properties || {};
                    operatorGroupKeys.add(p.parent_id || p.route_id || p.name);
                });
            }

            allRouteLayers.forEach(l => {
                const f = l.feature;
                const p = f.properties || {};
                const lKey = p.parent_id || p.route_id || p.name;
                const isSelected = Boolean(selectedGroupKey && lKey === selectedGroupKey);

                if (isLineTypeHidden(f) && !isSelected) {
                    if (map.hasLayer(l)) map.removeLayer(l);
                    return;
                }

                const isActive = isRouteFeatureActiveInYear(f, currentFilterYear);
                if (!isActive && yearFilterMode === 'hide' && !isSelected) {
                    if (map.hasLayer(l)) map.removeLayer(l);
                } else {
                    if (!map.hasLayer(l)) l.addTo(map);
                    l.setStyle(getLineStyle(f, isSelected, false));
                    if (isSelected && l.bringToFront) l.bringToFront();
                }
            });

            allStationLayers.forEach(stLayer => {
                if (!showStations) {
                    if (map.hasLayer(stLayer)) map.removeLayer(stLayer);
                    return;
                }
                const stFeat = stLayer.feature;
                const boundKeys = stFeat.properties._boundGroupKeys || [];
                const isSelectedSt = Boolean(selectedGroupKey && boundKeys.includes(selectedGroupKey));
                const isOperatorSt = Boolean(activeOperatorFilter && boundKeys.some(k => operatorGroupKeys.has(k)));
                const isShownSt = isSelectedSt || isOperatorSt;

                if (isLowZoom && !isShownSt) {
                    if (map.hasLayer(stLayer)) map.removeLayer(stLayer);
                    return;
                }

                const isActiveSt = isStationFeatureActiveInYear(stFeat, currentFilterYear);
                if (!isActiveSt && yearFilterMode === 'hide' && !isShownSt) {
                    if (map.hasLayer(stLayer)) map.removeLayer(stLayer);
                } else {
                    if (!map.hasLayer(stLayer)) stLayer.addTo(map);
                    stLayer.setStyle(getStationStyle(stFeat, isShownSt));
                    if (stLayer.bringToFront) stLayer.bringToFront();
                }
            });

            if (currentDrawerFeature && document.body.classList.contains('drawer-open')) {
                openRouteDrawer(currentDrawerFeature, false);
            }

            if (dropdown.style.display === 'block') {
                renderList(input.value);
            }
        }

        yearSelect.addEventListener('change', function() {
            currentFilterYear = this.value;
            map.closePopup();
            applyYearFilter();
        });

        prevYearBtn.addEventListener('click', function() {
            if (currentFilterYear !== 'all' && parseInt(currentFilterYear, 10) > MIN_YEAR) {
                yearSelect.value = String(parseInt(currentFilterYear, 10) - 1);
                yearSelect.dispatchEvent(new Event('change'));
            }
        });

        nextYearBtn.addEventListener('click', function() {
            if (currentFilterYear !== 'all' && parseInt(currentFilterYear, 10) < MAX_YEAR) {
                yearSelect.value = String(parseInt(currentFilterYear, 10) + 1);
                yearSelect.dispatchEvent(new Event('change'));
            }
        });

        yearModeSelect.addEventListener('change', function() {
            yearFilterMode = this.value;
            applyYearFilter();
        });

        yearResetBtn.addEventListener('click', function() {
            yearSelect.value = 'all';
            yearSelect.dispatchEvent(new Event('change'));
        });

        // 檢查選取路線是否被右側（或手機版底部）抽屜遮蔽，自動平滑推移讓位
        function ensureRouteNotCoveredByDrawer(groupBounds) {
            if (!groupBounds || !groupBounds.isValid()) return;
            const isDesktop = window.innerWidth > 768;
            const nePt = map.latLngToContainerPoint(groupBounds.getNorthEast());
            const swPt = map.latLngToContainerPoint(groupBounds.getSouthWest());

            if (isDesktop) {
                const drawerWidth = 390;
                const safeRightX = window.innerWidth - drawerWidth - 30;
                const safeLeftX = 40;
                const routePixelWidth = nePt.x - swPt.x;
                const availableWidth = safeRightX - safeLeftX;

                if (routePixelWidth > availableWidth * 0.9) {
                    map.fitBounds(groupBounds, {
                        paddingTopLeft: [50, 70],
                        paddingBottomRight: [drawerWidth + 30, 50]
                    });
                } else if (nePt.x > safeRightX) {
                    const routeCenterX = (swPt.x + nePt.x) / 2;
                    const visibleCenterX = (safeLeftX + safeRightX) / 2;
                    const panX = routeCenterX - visibleCenterX;
                    map.panBy([panX, 0], { animate: true, duration: 0.35 });
                }
            } else {
                const safeBottomY = window.innerHeight * 0.46;
                const safeTopY = 75;
                const routePixelHeight = swPt.y - nePt.y;
                const availableHeight = safeBottomY - safeTopY;

                if (routePixelHeight > availableHeight * 0.9) {
                    map.fitBounds(groupBounds, {
                        paddingTopLeft: [40, 75],
                        paddingBottomRight: [40, Math.round(window.innerHeight * 0.52)]
                    });
                } else if (swPt.y > safeBottomY) {
                    const routeCenterY = (nePt.y + swPt.y) / 2;
                    const visibleCenterY = (safeTopY + safeBottomY) / 2;
                    const panY = routeCenterY - visibleCenterY;
                    map.panBy([0, panY], { animate: true, duration: 0.35 });
                }
            }
        }

        function highlightRouteGroup(targetFeature, shouldFitBounds = false, triggerLayer = null) {
            activeOperatorFilter = null;
            opBanner.style.display = 'none';

            const targetProps = targetFeature.properties || {};
            selectedGroupKey = targetProps.parent_id || targetProps.route_id || targetProps.name;

            searchBox.classList.add('expanded');
            activeRouteName = targetProps.name || '未命名';
            activeRouteSection = (targetProps.section || '').replace(/\s*\([^)]*\)$/, '');
            input.value = activeRouteName;
            clearBtn.style.display = 'block';
            syncDisplay();

            let groupBounds = L.latLngBounds();

            allRouteLayers.forEach(l => {
                const f = l.feature;
                const lp = f.properties || {};
                const lKey = lp.parent_id || lp.route_id || lp.name;
                const isActive = isRouteFeatureActiveInYear(f, currentFilterYear);

                if (lKey === selectedGroupKey) {
                    if (!map.hasLayer(l)) l.addTo(map);
                    l.setStyle(getLineStyle(f, true, false));
                    if (l.bringToFront) l.bringToFront();
                    if (l.getBounds) groupBounds.extend(l.getBounds());
                } else {
                    if ((!isActive && yearFilterMode === 'hide') || isLineTypeHidden(f)) {
                        if (map.hasLayer(l)) map.removeLayer(l);
                    } else {
                        if (!map.hasLayer(l)) l.addTo(map);
                        l.setStyle(getLineStyle(f, false, false));
                    }
                }
            });

            allStationLayers.forEach(stLayer => {
                if (!showStations) {
                    if (map.hasLayer(stLayer)) map.removeLayer(stLayer);
                    return;
                }
                const stFeat = stLayer.feature;
                const boundKeys = stFeat.properties._boundGroupKeys || [];
                const isSelectedSt = boundKeys.includes(selectedGroupKey);
                const isActiveSt = isStationFeatureActiveInYear(stFeat, currentFilterYear);

                if ((map.getZoom() <= 10 && !isSelectedSt) || (!isActiveSt && yearFilterMode === 'hide' && !isSelectedSt)) {
                    if (map.hasLayer(stLayer)) map.removeLayer(stLayer);
                } else {
                    if (!map.hasLayer(stLayer)) stLayer.addTo(map);
                    stLayer.setStyle(getStationStyle(stFeat, isSelectedSt));
                    if (stLayer.bringToFront) stLayer.bringToFront();
                }
            });

            openRouteDrawer(targetFeature, true);

            if (groupBounds.isValid()) {
                if (shouldFitBounds) {
                    const isDesktop = window.innerWidth > 768;
                    map.fitBounds(groupBounds, {
                        paddingTopLeft: [50, 70],
                        paddingBottomRight: isDesktop ? [420, 50] : [50, Math.round(window.innerHeight * 0.52)]
                    });
                } else {
                    ensureRouteNotCoveredByDrawer(groupBounds);
                }
            }
        }

        function clearRouteSelection() {
            selectedGroupKey = null;
            activeOperatorFilter = null;
            currentDrawerFeature = null;
            activeRouteName = '';
            activeRouteSection = '';
            input.value = '';
            syncDisplay();
            dropdown.style.display = 'none';
            searchBox.classList.remove('expanded');
            clearBtn.style.display = 'none';
            opBanner.style.display = 'none';
            document.body.classList.remove('drawer-open');
            infoDrawer.classList.remove('full-mobile');
            applyYearFilter();
            map.closePopup();
        }

        function updateUrlHash() {
            const params = new URLSearchParams();
            const activeCode = (currentDrawerFeature && currentDrawerFeature.properties && currentDrawerFeature.properties.route_id) || selectedGroupKey;
            if (activeCode && document.body.classList.contains('drawer-open')) {
                params.set('route', activeCode);
            } else if (selectedGroupKey) {
                params.set('route', selectedGroupKey);
            }
            if (currentFilterYear !== 'all') params.set('year', currentFilterYear);
            const hashStr = params.toString();
            history.replaceState(null, '', hashStr ? `#${hashStr}` : window.location.pathname + window.location.search);
        }

        function copyPermalink() {
            updateUrlHash();
            navigator.clipboard.writeText(window.location.href).then(() => {
                showToast('✅ 已複製專屬路線連結！可直接貼上分享');
            }).catch(() => {
                showToast('🔗 請直接複製瀏覽器網址列分享');
            });
        }

        function applyInitialUrlHash() {
            if (!window.location.hash) return;
            const params = new URLSearchParams(window.location.hash.substring(1));
            const yr = params.get('year');
            const rt = params.get('route');

            if (yr && yr >= MIN_YEAR && yr <= MAX_YEAR) {
                currentFilterYear = String(yr);
                yearSelect.value = currentFilterYear;
                yfBar.classList.add('open');
                applyYearFilter();
            }
            if (rt) {
                const targetFeat = routeByIdMap[rt] || masterRouteFeatureMap[rt];
                if (targetFeat) {
                    setTimeout(() => {
                        highlightRouteGroup(targetFeat, true, null);
                    }, 200);
                }
            }
        }

        // 從內嵌表格 HTML 提取業者與區間資訊
        function extractMetaFromTableHtml(tableHtml) {
            const rowRegex = /<tr>\s*<td[^>]*>([\s\S]*?)<\/td>\s*<td[^>]*>([\s\S]*?)<\/td>\s*<td[^>]*>([\s\S]*?)<\/td>\s*<td[^>]*>([\s\S]*?)<\/td>\s*<td[^>]*>([\s\S]*?)<\/td>\s*<\/tr>/g;
            const ops = [];
            const secs = [];
            let m;
            while ((m = rowRegex.exec(tableHtml)) !== null) {
                const op = m[2].replace(/<[^>]+>/g, '').trim();
                const sec = m[4].replace(/<[^>]+>/g, '').trim();
                if (op && op !== '—' && !ops.includes(op)) ops.push(op);
                if (sec && sec !== '—' && !secs.includes(sec)) secs.push(sec);
            }
            const lastSec = secs.length > 0 ? secs[secs.length - 1].replace(/-/g, '＝').replace(/—/g, '＝') : '';
            return { operators: ops.join('、'), section: lastSec };
        }

        // 建立家族成員清冊（整合 KML 獨立副線與主線內嵌子路線）
        function buildFamilyRegistry(routeFeaturesList) {
            const byGroup = {};
            routeFeaturesList.forEach(f => {
                const p = f.properties || {};
                const gk = p.parent_id || p.route_id || p.name;
                if (!byGroup[gk]) byGroup[gk] = [];
                byGroup[gk].push(f);
            });

            Object.keys(byGroup).forEach(gk => {
                const flist = byGroup[gk];
                const membersDict = {};
                const opsSet = new Set();

                // 先找出主線 Feature
                const mainFeat = flist.find(f => f.properties.line_type === '主線') || flist[0];
                const mainProps = mainFeat.properties || {};

                // 拆解某段 description.zh 為 [主表格, 子標題1, 子表格1, 子標題2, 子表格2...]
                const splitDesc = (descStr) => {
                    if (!descStr) return [''];
                    const stripped = descStr.replace(/^<div style="margin-bottom:6px;">[\s\S]*?<\/div>/, '').trim();
                    return stripped.split(/<div[^>]*>\s*▸\s*(?:附屬統計|相關路線)：\s*([^<]+)<\/div>/);
                };

                const mainParts = splitDesc((mainProps.description && mainProps.description.zh) || '');
                const mainTableOnly = mainParts[0] ? mainParts[0].trim() : '';

                // 1. 登錄所有 KML 實體路線 Feature
                flist.forEach(f => {
                    const p = f.properties || {};
                    const rid = p.route_id || p.name;
                    const ltype = p.line_type || '主線';

                    if (p.operators) {
                        p.operators.split('、').map(s => s.trim()).filter(Boolean).forEach(op => opsSet.add(op));
                    }

                    const parts = splitDesc((p.description && p.description.zh) || '');
                    let ownTable = parts[0] ? parts[0].trim() : '';
                    let hasTable = ownTable.includes('<table');

                    // 若非主線（如未命名支線 B4-支線）卻因舊版匯入器 fallback 而複製了與主線一模一樣的表格，視為無獨立統計表
                    if (rid !== gk && hasTable && ownTable === mainTableOnly) {
                        ownTable = '<div style="color:#777;font-size:12px;">（年報無獨立統計資料）</div>';
                        hasTable = false;
                    }

                    const existing = membersDict[rid];
                    const shouldReplace = !existing || (ltype === '主線') || (existing.lineType === '舊線' && ltype !== '舊線');

                    if (shouldReplace) {
                        membersDict[rid] = {
                            id: rid,
                            lineType: ltype,
                            badgeText: `${rid} ${ltype}`.trim(),
                            section: (p.section || '').replace(/\s*\([^)]*\)$/, ''),
                            operators: p.operators || '',
                            tableHtml: ownTable,
                            hasTable: hasTable,
                            feature: f,
                            isMain: (rid === gk)
                        };
                        routeByIdMap[rid] = f;
                    }
                });

                // 2. 登錄內嵌於主線 description.zh 中的子路線（如 A1-1、C1-1、C1-2、B29-3、C7-1~3）
                for (let i = 1; i < mainParts.length; i += 2) {
                    const subTitle = mainParts[i].trim(); // 例："A1-1 三爪子複線"
                    const subTable = (mainParts[i + 1] || '').trim();
                    const spaceIdx = subTitle.indexOf(' ');
                    const subCode = spaceIdx > 0 ? subTitle.substring(0, spaceIdx).trim() : subTitle;
                    const subLabel = spaceIdx > 0 ? subTitle.substring(spaceIdx + 1).trim() : '副線';
                    const meta = extractMetaFromTableHtml(subTable);

                    if (meta.operators) {
                        meta.operators.split('、').map(s => s.trim()).filter(Boolean).forEach(op => opsSet.add(op));
                    }

                    if (!membersDict[subCode]) {
                        const virtualFeature = {
                            type: "Feature",
                            properties: {
                                route_id: subCode,
                                parent_id: gk,
                                line_type: subLabel,
                                name: mainProps.name,
                                tailo: mainProps.tailo || '',
                                section: meta.section || subLabel,
                                operators: meta.operators || mainProps.operators || '',
                                description: { zh: subTable }
                            },
                            geometry: mainFeat.geometry
                        };
                        membersDict[subCode] = {
                            id: subCode,
                            lineType: subLabel,
                            badgeText: `${subCode} ${subLabel}`.trim(),
                            section: meta.section || subLabel,
                            operators: meta.operators,
                            tableHtml: subTable,
                            hasTable: subTable.includes('<table'),
                            feature: virtualFeature,
                            isMain: false
                        };
                        routeByIdMap[subCode] = virtualFeature;
                    }
                }

                // 3. 排序：主線永遠第一，其餘依子編號自然排序（如 C5 -> C5-1 -> C5-2 -> C5-3）
                const sortedList = Object.values(membersDict).sort((a, b) => {
                    if (a.isMain !== b.isMain) return a.isMain ? -1 : 1;
                    return a.id.localeCompare(b.id, undefined, { numeric: true });
                });

                familyMembersMap[gk] = sortedList;
                familyOperatorsMap[gk] = opsSet;
            });
        }

        fetch('data.json?t=' + new Date().getTime())
            .then(response => response.json())
            .then(rawData => {
                const geoData = rawData.data || rawData; 
                const rawFeatures = geoData.features || [];

                const seenStations = new Set();
                const cleanFeatures = rawFeatures.filter(f => {
                    const p = f.properties || {};
                    const isPoint = f.geometry && f.geometry.type === "Point";

                    if (isPoint) {
                        const coordKey = `${p.name}_${f.geometry.coordinates.join(',')}`;
                        if (seenStations.has(coordKey)) return false;
                        seenStations.add(coordKey);
                        return true;
                    }

                    const descText = (p.description && p.description.zh) ? p.description.zh : "";
                    if (!p.route_id && /^(A\d+(-\d+)?|未命名路線|Line\s+)/i.test(p.name || "") && descText.includes("在此輸入中文歷史描述")) {
                        return false;
                    }
                    return true;
                });

                const routeFeaturesList = [];
                const stationFeaturesList = [];
                const routeGroupSeen = new Set();

                cleanFeatures.forEach(f => {
                    const p = f.properties || {};
                    if (f.geometry && f.geometry.type === "Point") {
                        stationFeaturesList.push(f);
                        searchableStations.push(f);
                    } else if (f.geometry) {
                        routeFeaturesList.push(f);
                        const groupKey = p.parent_id || p.route_id || p.name;
                        if (p.name && !routeKeyToNameMap[groupKey]) {
                            routeKeyToNameMap[groupKey] = p.name;
                        }
                        if (!masterRouteFeatureMap[groupKey] || p.line_type === "主線") {
                            masterRouteFeatureMap[groupKey] = f;
                        }
                        const descText = (p.description && p.description.zh) ? p.description.zh : "";
                        if (descText.includes("<table") && (!masterRouteDescMap[groupKey] || p.line_type === "主線")) {
                            masterRouteDescMap[groupKey] = descText;
                        }
                        if (p.history && p.history.length > 0 && (!masterRouteHistoryMap[groupKey] || p.line_type === "主線")) {
                            masterRouteHistoryMap[groupKey] = p.history;
                        }
                    }
                });

                // 建立家族成員與「相關路線」雙向切換索引
                buildFamilyRegistry(routeFeaturesList);

                stationFeaturesList.forEach(st => {
                    const [px, py] = st.geometry.coordinates;
                    const boundFeatures = [];
                    const boundGroupKeys = new Set();
                    let nearestFeature = null;
                    let nearestDist = Infinity;

                    routeFeaturesList.forEach(rf => {
                        const d = minDistToGeometryMeters(px, py, rf.geometry);
                        if (d < nearestDist) {
                            nearestDist = d;
                            nearestFeature = rf;
                        }
                        if (d <= 80) {
                            boundFeatures.push(rf);
                            const gk = rf.properties.parent_id || rf.properties.route_id || rf.properties.name;
                            if (gk) boundGroupKeys.add(gk);
                        }
                    });

                    if (boundFeatures.length === 0 && nearestFeature && nearestDist <= 200) {
                        boundFeatures.push(nearestFeature);
                        const gk = nearestFeature.properties.parent_id || nearestFeature.properties.route_id || nearestFeature.properties.name;
                        if (gk) boundGroupKeys.add(gk);
                    }

                    st.properties._boundRouteFeatures = boundFeatures;
                    st.properties._boundGroupKeys = Array.from(boundGroupKeys);
                });

                routeFeaturesList.forEach(f => {
                    const p = f.properties || {};
                    const groupKey = p.parent_id || p.route_id || p.name;
                    if (!routeGroupSeen.has(groupKey) && (p.line_type === "主線" || !p.line_type)) {
                        routeGroupSeen.add(groupKey);
                        searchableRoutes.push(f);
                    }
                });
                routeFeaturesList.forEach(f => {
                    const p = f.properties || {};
                    const groupKey = p.parent_id || p.route_id || p.name;
                    if (!routeGroupSeen.has(groupKey)) {
                        routeGroupSeen.add(groupKey);
                        searchableRoutes.push(f);
                    }
                });

                geojsonLayer = L.geoJSON({ type: "FeatureCollection", features: cleanFeatures }, {
                    style: function (feature) {
                        return getLineStyle(feature, false, false);
                    },
                    pointToLayer: function (feature, latlng) {
                        const canInteract = hasStationHistory(feature);
                        const styleOpts = Object.assign({}, getStationStyle(feature, false), {
                            interactive: canInteract
                        });
                        const marker = L.circleMarker(latlng, styleOpts);
                        if (feature.properties && feature.properties.name) {
                            marker.bindTooltip(feature.properties.name, {
                                permanent: true,
                                direction: 'top',
                                className: 'station-label',
                                offset: [0, -5]
                            });
                        }
                        return marker;
                    },
                    onEachFeature: function (feature, layer) {
                        const isPoint = feature.geometry && feature.geometry.type === "Point";
                        if (isPoint) {
                            allStationLayers.push(layer);
                            const bKeys = feature.properties._boundGroupKeys || [];
                            bKeys.forEach(k => {
                                if (!groupStationsMap[k]) groupStationsMap[k] = [];
                                groupStationsMap[k].push(layer);
                            });

                            if (hasStationHistory(feature)) {
                                layer.bindPopup(() => buildStationPopupContent(feature), {
                                    className: 'custom-popup',
                                    maxWidth: 280
                                });
                                layer.on('click', () => { lastFeatureClickTime = Date.now(); });
                            }
                        } else {
                            allRouteLayers.push(layer);
                            layer.on('click', () => {
                                lastFeatureClickTime = Date.now();
                                setTimeout(() => { input.blur(); syncDisplay(); }, 0);
                                highlightRouteGroup(feature, false, layer);
                            });
                        }
                    }
                }).addTo(map);

                if (geojsonLayer.getBounds().isValid()) map.fitBounds(geojsonLayer.getBounds());
                applyYearFilter();
                applyInitialUrlHash();
            });

        const searchBox = document.getElementById('custom-search-box');
        const input = document.getElementById('searchInput');
        const displayLayer = document.getElementById('input-display-layer');
        const dropdown = document.getElementById('searchDropdown');
        const clearBtn = document.getElementById('clearBtn'); 

        function syncDisplay() {
            const val = input.value;
            if (val === '') {
                displayLayer.innerHTML = '<span style="color:#999; font-size:15px;">搜尋路線、編號(A1)、舊稱、會社或車站...</span>';
                return;
            }

            let safeVal = val.replace(/</g, "&lt;").replace(/>/g, "&gt;");
            const isFocused = (document.activeElement === input);
            
            if (!isFocused && val === activeRouteName && activeRouteSection) {
                let safeSection = activeRouteSection.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                displayLayer.innerHTML = `${safeVal} <span style="font-size:12px; color:#999; margin-left:5px;">${safeSection}</span>`;
            } else {
                displayLayer.innerHTML = safeVal;
            }
        }

        input.addEventListener('focus', function() {
            if (!searchBox.classList.contains('expanded')) {
                searchBox.classList.add('expanded');
                clearBtn.style.display = 'block';
            }
            syncDisplay(); 
            setTimeout(() => { renderList(input.value); }, 100);
        });

        searchBox.addEventListener('click', function(e) {
            if (!this.classList.contains('expanded')) {
                this.classList.add('expanded');
                clearBtn.style.display = 'block';
                syncDisplay();
                renderList(input.value);
            }
        });

        input.addEventListener('blur', () => syncDisplay());

        function renderList(val) {
            isRenderingList = true;
            syncDisplay(); 
            
            const keyword = val.trim().toLowerCase();
            dropdown.innerHTML = '';
            clearBtn.style.display = 'block';

            const normalize = str => str ? str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '') : '';
            const cleanKeyword = normalize(keyword);

            const yearFilteredPool = searchableRoutes.filter(f => isRouteFeatureActiveInYear(f, currentFilterYear));

            let matchedRoutes = [];
            if (keyword === '') {
                matchedRoutes = yearFilteredPool.map(f => ({ feature: f, reason: '' }));
            } else {
                yearFilteredPool.forEach(f => {
                    const p = f.properties || {};
                    const code = (p.parent_id || p.route_id || '').toLowerCase();
                    const nameMatch = normalize(p.name || "").includes(cleanKeyword);
                    const tailoMatch = normalize(p.tailo || "").includes(cleanKeyword);
                    const codeMatch = code.includes(cleanKeyword);
                    const altMatch = normalize(p.alt_names || "").includes(cleanKeyword);
                    const opMatch = normalize(p.operators || "").includes(cleanKeyword);

                    if (codeMatch) matchedRoutes.push({ feature: f, reason: `<span class="match-tag code">${p.parent_id || p.route_id}</span>` });
                    else if (nameMatch || tailoMatch) matchedRoutes.push({ feature: f, reason: p.parent_id ? `<span class="match-tag code">${p.parent_id}</span>` : '' });
                    else if (altMatch) matchedRoutes.push({ feature: f, reason: `<span class="match-tag">舊稱:${p.alt_names.split('、')[0]}</span>` });
                    else if (opMatch) matchedRoutes.push({ feature: f, reason: `<span class="match-tag">會社</span>` });
                });
            }

            matchedRoutes.sort((a, b) => {
                const pa = a.feature.properties, pb = b.feature.properties;
                return (pa.tailo || pa.name || "").localeCompare(pb.tailo || pb.name || "", 'zh-Hant');
            });

            let matchedStations = [];
            if (keyword !== '') {
                matchedStations = allStationLayers.filter(stLayer => {
                    const stFeat = stLayer.feature;
                    if (!isStationFeatureActiveInYear(stFeat, currentFilterYear)) return false;
                    return normalize(stFeat.properties.name || "").includes(cleanKeyword);
                }).slice(0, 10);
            }

            if (matchedRoutes.length > 0 || matchedStations.length > 0) {
                dropdown.style.display = 'block';
                if (keyword === '' && matchedRoutes.length > 0) {
                    const randomItem = document.createElement('div');
                    randomItem.className = 'search-item random-item';
                    const yearLabel = currentFilterYear === 'all' ? '' : ` (${currentFilterYear}年・共${matchedRoutes.length}條)`;
                    randomItem.innerHTML = `🎲 隨機探索一條路線${yearLabel}`;
                    
                    randomItem.onclick = (e) => {
                        e.stopPropagation(); 
                        dropdown.style.display = 'none';
                        const pick = matchedRoutes[Math.floor(Math.random() * matchedRoutes.length)].feature;
                        setTimeout(() => { input.blur(); syncDisplay(); }, 0);
                        highlightRouteGroup(pick, true, null);
                    };
                    dropdown.appendChild(randomItem);
                }
                
                let currentLetter = ''; 
                matchedRoutes.forEach(({ feature: f, reason }) => {
                    const tailoStr = f.properties.tailo || "";
                    const firstChar = tailoStr ? tailoStr.charAt(0).toUpperCase() : "#";
                    if (firstChar !== currentLetter) {
                        currentLetter = firstChar;
                        const header = document.createElement('div');
                        header.className = 'search-letter-header';
                        header.textContent = currentLetter;
                        dropdown.appendChild(header);
                    }
                    const item = document.createElement('div');
                    item.className = 'search-item';
                    const lineName = f.properties.name || '未命名';
                    const sectionName = (f.properties.section || '').replace(/\s*\([^)]*\)$/, '');
                    const leftHtml = sectionName ? `<span><b>${lineName}</b><span style="font-size:12px; color:#888; margin-left:8px;">${sectionName}</span></span>` : `<b>${lineName}</b>`;
                    item.innerHTML = `${leftHtml}${reason}`;
                    
                    item.onclick = (e) => {
                        e.stopPropagation(); 
                        dropdown.style.display = 'none';
                        setTimeout(() => { input.blur(); syncDisplay(); }, 0);
                        highlightRouteGroup(f, true, null);
                    };
                    dropdown.appendChild(item);
                });

                if (matchedStations.length > 0) {
                    const stHeader = document.createElement('div');
                    stHeader.className = 'search-letter-header';
                    stHeader.textContent = '🚉 相關車站點位';
                    dropdown.appendChild(stHeader);

                    matchedStations.forEach(stLayer => {
                        const stFeat = stLayer.feature;
                        const stName = stFeat.properties.name || '車站';
                        const bKeys = stFeat.properties._boundGroupKeys || [];
                        const parentName = bKeys.length > 0 ? (routeKeyToNameMap[bKeys[0]] || bKeys[0]) : '';
                        const item = document.createElement('div');
                        item.className = 'search-item';
                        item.innerHTML = `<span>🚉 <b>${stName}</b></span><span class="match-tag st">${parentName}</span>`;
                        item.onclick = (e) => {
                            e.stopPropagation();
                            dropdown.style.display = 'none';
                            if (!showStations) setStationsVisibility(true);
                            if (bKeys.length > 0 && masterRouteFeatureMap[bKeys[0]]) {
                                highlightRouteGroup(masterRouteFeatureMap[bKeys[0]], false, null);
                            }
                            if (!map.hasLayer(stLayer)) stLayer.addTo(map);
                            const targetLatLng = stLayer.getLatLng();
                            const isDesktop = window.innerWidth > 768;
                            const pt = map.project(targetLatLng, 15);
                            const offsetPt = isDesktop ? L.point(pt.x + 195, pt.y) : L.point(pt.x, pt.y + window.innerHeight * 0.22);
                            map.flyTo(map.unproject(offsetPt, 15), 15, { duration: 0.9 });
                            if (stLayer.getPopup()) {
                                setTimeout(() => stLayer.openPopup(), 450);
                            }
                        };
                        dropdown.appendChild(item);
                    });
                }
            } else {
                dropdown.style.display = 'none';
            }
            
            setTimeout(() => { isRenderingList = false; }, 50);
        }

        input.oninput = function() { 
            if (this.value !== activeRouteName) { activeRouteName = ''; activeRouteSection = ''; }
            syncDisplay();
            renderList(this.value); 
        };

        clearBtn.onclick = function(e) {
            e.stopPropagation();
            if (input.value.length > 0 || selectedGroupKey !== null || activeOperatorFilter !== null) {
                clearRouteSelection();
                if (window.innerWidth > 768) input.focus(); 
            } else {
                searchBox.classList.remove('expanded');
                dropdown.style.display = 'none';
                this.style.display = 'none';
            }
        };

        document.addEventListener('click', function(e) {
            if (!searchBox.contains(e.target)) {
                dropdown.style.display = 'none';
                if (input.value.trim() === '') searchBox.classList.remove('expanded');
            }
        });
        
        map.on('click', function() {
            dropdown.style.display = 'none';
            if (Date.now() - lastFeatureClickTime < 150) return;

            if (selectedGroupKey !== null || activeRouteName !== '' || activeOperatorFilter !== null) {
                clearRouteSelection();
            }
        });
        
        dropdown.addEventListener('scroll', function() { 
            if (!isRenderingList) { input.blur(); }
        }, { passive: true });
    </script>
</body>
